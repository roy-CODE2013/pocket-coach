/* Layout: ◊§◊° ◊§◊™◊ô◊ó◊î ◊õ◊î◊î ◊õ◊û◊ï ◊®◊¶◊§◊™ ◊ó◊ì◊® ◊õ◊ï◊©◊®, ◊†◊ô◊ï◊ï◊ò ◊ì◊ë◊ô◊ß, ◊ï◊§◊®◊ß◊ô◊ù ◊©◊õ◊ú ◊ê◊ó◊ì ◊û◊°◊ï◊û◊ü ◊ë◊¶◊ë◊¢ ◊©◊ú ◊§◊ú◊ò◊™ ◊û◊©◊ß◊ú ◊™◊ó◊®◊ï◊™◊ô◊™ */
:root {
  --bg: #f2f3f6;          /* ◊ê◊ë◊ß◊™ ◊û◊í◊†◊ñ◊ô◊ï◊ù */
  --surface: #ffffff;
  --ink: #171a21;         /* ◊ë◊®◊ñ◊ú ◊ô◊¶◊ï◊ß */

  --iron-2: #1e222b;

  --iron-muted: #9aa1b0;
  --shadow: 0 1px 2px rgba(20,23,29,.05), 0 8px 24px -12px rgba(20,23,29,.18);

  --f-body: "IBM Plex Sans Hebrew", "Arial Hebrew", system-ui, sans-serif;
  --f-num: "IBM Plex Mono", ui-monospace, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #101318; --surface: #191d25; --ink: #eceef2; --muted: #a3a9b6; --line: #2b313c;
    --accent: #7097ff; --accent-soft: #1c2948; --red: #f05b52; --yellow: #f0c23a; --green: #4cc27e; --violet: #a98bff;

}
:root[data-theme="dark"] {
  --bg: #101318; --surface: #191d25; --ink: #eceef2; --muted: #a3a9b6; --line: #2b313c;

* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 17px; line-height: 1.7; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
.wrap { max-width: 920px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

/* ---------- hero ---------- */
.hero { background: var(--iron); color: var(--iron-ink); position: relative; overflow: hidden; }
.hero::after { /* ◊®◊¶◊§◊™ ◊í◊ï◊û◊ô: ◊®◊©◊™ ◊¢◊ì◊ô◊†◊î */
  content: ""; position: absolute; inset: 0; pointer-events: none; opacity: .5;
  background-image: linear-gradient(var(--iron-2) 1px, transparent 1px), linear-gradient(90deg, var(--iron-2) 1px, transparent 1px);
  background-size: 48px 48px;
  mask-image: linear-gradient(to bottom, transparent, #000 40%, #000 70%, transparent);
  -webkit-mask-image: linear-gradient(to bottom, transparent, #000 40%, #000 70%, transparent);
}
.hero .wrap { position: relative; z-index: 1; padding-block: 28px 40px; display: grid; gap: 22px; }

.eyebrow::before { content: ""; width: 28px; height: 3px; background: var(--red); border-radius: 2px; }
.langs { display: inline-flex; gap: 2px; padding: 3px; border: 1px solid var(--iron-2); border-radius: 999px; background: rgba(255,255,255,.03); }
.langs button { font: inherit; font-size: .85rem; cursor: pointer; border: 0; background: transparent; color: var(--iron-muted); padding: 6px 14px; border-radius: 999px; white-space: nowrap; }
.langs button:hover { color: var(--iron-ink); }
.langs button[aria-pressed="true"] { background: var(--iron-ink); color: var(--iron); }

.hero h1 em { font-style: normal; color: transparent; -webkit-text-stroke: 2px var(--iron-ink); }
.lede { font-size: clamp(1.05rem, 2.4vw, 1.25rem); color: var(--iron-muted); max-width: 52ch; }
.lede b { color: var(--iron-ink); font-weight: 500; }
.bar { width: 100%; max-width: 100%; height: auto; display: block; margin-block: 6px; overflow: visible; }
.bar .p { transform-box: fill-box; transform-origin: center; }
@media (prefers-reduced-motion: no-preference) {
  .bar .l { animation: slideL .7s cubic-bezier(.2,.8,.2,1) both; }
  .bar .r { animation: slideR .7s cubic-bezier(.2,.8,.2,1) both; }
  .bar .d1 { animation-delay: .05s } .bar .d2 { animation-delay: .15s } .bar .d3 { animation-delay: .25s } .bar .d4 { animation-delay: .35s }
  @keyframes slideL { from { transform: translateX(-60px); } to { transform: none; } }
  @keyframes slideR { from { transform: translateX(60px); } to { transform: none; } }
}

.stat { display: grid; gap: 2px; }

@media (max-width: 600px) { .stats { grid-template-columns: repeat(2, 1fr); row-gap: 20px; } }

/* ---------- app shell: side menu, one page at a time ---------- */
.app { display: grid; grid-template-columns: 250px minmax(0, 1fr); min-height: 100vh; }
.side { position: sticky; top: env(safe-area-inset-top, 0px); align-self: start; height: calc(100vh - env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; gap: 18px; padding-block: 22px; padding-inline: 14px; background: var(--iron); color: var(--iron-ink); overflow-y: auto; }

/* QR to open the site on a phone */
.qrbox { display: grid; grid-template-columns: 64px minmax(0, 1fr); gap: 10px; align-items: center; padding: 10px; border-radius: 12px; background: var(--iron-2); margin-top: auto; }

.qrmodal-in { position: relative; width: min(420px, 100%); background: var(--surface); color: var(--ink); border-radius: 22px; padding: 24px; display: grid; gap: 12px; justify-items: center; text-align: center; box-shadow: 0 30px 80px -20px rgba(0,0,0,.6); }

.qrx { position: absolute; top: 10px; inset-inline-end: 10px; width: 38px; height: 38px; border-radius: 50%; border: 0; background: var(--bg); color: var(--ink); font-size: 1.2rem; cursor: pointer; }
.msheet .qrbox { background: var(--bg); grid-template-columns: 44px minmax(0, 1fr); margin-top: 0; }

/* ---------- sections ---------- */
main section { padding-block: 64px; display: grid; gap: 22px; }
main section + section { border-top: 1px solid var(--line); }
.sec-head { display: grid; gap: 10px; }
.chap { display: inline-flex; align-items: center; gap: 10px; font-family: var(--f-num); font-size: .8rem; letter-spacing: .1em; color: var(--muted); }
.chap i { width: 8px; height: 26px; border-radius: 2px; background: var(--c); display: inline-block; }
.intro { color: var(--muted); font-size: 1.05rem; }

.pillars { display: grid; grid-template-columns: repeat(2, 1fr); gap: 16px; }
@media (max-width: 640px) { .pillars { grid-template-columns: 1fr; } }
.pillar { background: var(--surface); border-radius: 14px; padding: 22px; display: grid; grid-template-columns: auto 1fr; gap: 6px 18px; align-items: start; box-shadow: var(--shadow); min-width: 0; }
.pillar .disc { grid-row: span 3; width: 56px; height: 56px; border-radius: 50%; background: var(--c); position: relative; }
.pillar .disc::after { content: ""; position: absolute; inset: 21px; border-radius: 50%; background: var(--surface); }
.pillar .big { font-family: var(--f-num); font-weight: 600; font-size: 1.45rem; color: var(--ink); line-height: 1.2; }
.pillar p { color: var(--muted); font-size: .97rem; }

/* RIR */
.rir { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; align-items: end; background: var(--surface); padding: 22px 18px 16px; border-radius: 14px; box-shadow: var(--shadow); }
.rir .col { display: grid; gap: 8px; justify-items: center; text-align: center; }
.rir .fill { width: 100%; max-width: 70px; border-radius: 8px 8px 3px 3px; background: var(--accent); height: var(--h); }
.rir .off .fill { background: var(--line); }
.rir .n { font-family: var(--f-num); font-weight: 600; font-size: 1.35rem; line-height: 1; }
.rir small { color: var(--muted); font-size: .8rem; line-height: 1.3; }
.rir .band { grid-column: 1 / 5; border-top: 2px solid var(--accent); padding-top: 6px; font-size: .82rem; color: var(--accent); text-align: center; font-weight: 500; }
.caption { font-size: .9rem; color: var(--muted); }

/* calculator */
.calc { display: grid; grid-template-columns: 1.1fr 1fr; border-radius: 16px; box-shadow: var(--shadow); }
.calc .in { background: var(--surface); padding: 24px; display: grid; gap: 22px; align-content: start; border-start-start-radius: 16px; border-end-start-radius: 16px; min-width: 0; }
.calc .out { background: var(--iron); color: var(--iron-ink); border-start-end-radius: 16px; border-end-end-radius: 16px; min-width: 0; }
@media (max-width: 760px) {
  .calc { grid-template-columns: 1fr; }
  .calc .in { border-radius: 16px 16px 0 0; }
  .calc .out { border-radius: 0 0 16px 16px; }
}
.out-inner { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 16px); padding: 24px; display: grid; gap: 18px; }
fieldset { border: 0; margin: 0; padding: 0; min-width: 0; }
.field { display: grid; gap: 8px; }
.field-top { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
.field-top label, legend { font-size: .9rem; color: var(--ink); font-weight: 500; padding: 0; }
legend { margin-bottom: 8px; }
.field-top small, legend small { color: var(--muted); font-weight: 400; }
output { font-family: var(--f-num); font-weight: 600; font-variant-numeric: tabular-nums; color: var(--accent); unicode-bidi: isolate; }
.pair { display: grid; grid-template-columns: 1fr 1fr; gap: 22px; }
@media (max-width: 420px) { .pair { grid-template-columns: 1fr; } }
input[type="range"] { width: 100%; accent-color: var(--accent); margin: 0; height: 28px; cursor: pointer; }
input[type="number"] { font: inherit; font-size: 1rem; color: var(--ink); background: var(--bg); border: 1px solid var(--line); border-radius: 10px; padding: 9px 12px; width: 100%; }
input[type="number"]:focus { border-color: var(--accent); outline: none; box-shadow: 0 0 0 3px var(--accent-soft); }
.seg { display: grid; grid-template-columns: repeat(var(--n, 2), 1fr); gap: 6px; }
.seg.col { grid-template-columns: 1fr; }
.opt { position: relative; cursor: pointer; }
.opt input { position: absolute; opacity: 0; inset: 0; margin: 0; cursor: pointer; }
.opt span { display: flex; justify-content: center; align-items: baseline; gap: 10px; padding: 9px 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--bg); font-size: .93rem; text-align: center; transition: background .15s, border-color .15s; }
.seg.col .opt span { justify-content: space-between; text-align: start; }
.opt span small { color: var(--muted); font-size: .8rem; }
.opt:hover span { border-color: var(--muted); }
.opt input:checked + span { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.opt input:checked + span small { color: inherit; opacity: .75; }
.opt input:focus-visible + span { outline: 3px solid var(--accent); outline-offset: 2px; }
.kcal { display: grid; gap: 2px; }
.kcal .v { font-family: var(--f-num); font-weight: 600; font-size: clamp(2.6rem, 7vw, 3.6rem); line-height: 1; font-variant-numeric: tabular-nums; }
.kcal .l { color: var(--iron-muted); font-size: .9rem; }
.kcal .d { color: var(--iron-muted); font-size: .85rem; font-family: var(--f-num); }
.split { display: flex; height: 12px; border-radius: 6px; overflow: hidden; gap: 3px; }
.split span { transition: flex-grow .4s; min-width: 4px; }
.macros { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
.macro { display: grid; gap: 0; }
.macro .v { font-family: var(--f-num); font-weight: 600; font-size: 1.4rem; font-variant-numeric: tabular-nums; }
.macro .v small { font-size: .8rem; color: var(--iron-muted); font-weight: 500; }
.macro .l { font-size: .82rem; color: var(--iron-muted); display: flex; align-items: center; gap: 6px; }
.facts { display: grid; grid-template-columns: 1fr 1fr; gap: 1px; background: var(--iron-2); border-radius: 12px; overflow: hidden; margin: 0; }
.facts div { background: var(--iron); padding: 12px 14px; display: grid; gap: 2px; }
.facts dt { font-size: .8rem; color: var(--iron-muted); }
.facts dd { margin: 0; font-family: var(--f-num); font-weight: 600; font-size: 1.1rem; font-variant-numeric: tabular-nums; }
.copy { font: inherit; font-size: .92rem; cursor: pointer; border: 1px solid var(--iron-muted); background: transparent; color: var(--iron-ink); border-radius: 10px; padding: 9px 14px; justify-self: start; }
.copy:hover { background: var(--iron-2); }
.calc .note { font-size: .85rem; color: var(--iron-muted); border-top: 1px solid var(--iron-2); padding-top: 12px; }
.out details { background: transparent; box-shadow: none; border: 1px solid var(--iron-2); }
.out summary { padding: 10px 14px; font-size: .9rem; color: var(--iron-ink); }
.out details p { padding: 0 14px 12px; color: var(--iron-muted); font-size: .85rem; }

/* program */
.tabs { display: inline-flex; gap: 4px; padding: 4px; background: var(--surface); border-radius: 12px; box-shadow: var(--shadow); justify-self: start; flex-wrap: wrap; }
.tab { font: inherit; font-size: .95rem; cursor: pointer; border: 0; background: transparent; color: var(--muted); padding: 8px 16px; border-radius: 9px; }
.tab[aria-selected="true"] { background: var(--ink); color: var(--bg); }
.days { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 16px; }
.day { background: var(--surface); border-radius: 14px; box-shadow: var(--shadow); overflow: hidden; min-width: 0; }
.day header { display: flex; justify-content: space-between; align-items: baseline; padding: 14px 18px; border-bottom: 1px solid var(--line); }
.day header small { font-family: var(--f-num); color: var(--muted); font-size: .8rem; }
.day ul { list-style: none; margin: 0; padding: 6px 18px 12px; display: grid; }
.day li { display: flex; justify-content: space-between; gap: 12px; padding-block: 8px; font-size: .96rem; }
.day li + li { border-top: 1px dashed var(--line); }
.day .sets { font-family: var(--f-num); color: var(--accent); white-space: nowrap; direction: ltr; font-weight: 500; }

/* buttons + AI bits */
.btn { font: inherit; font-size: .95rem; font-weight: 500; display: inline-flex; align-items: center; justify-content: center; gap: 8px; padding: 10px 16px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); cursor: pointer; text-decoration: none; }
.btn:hover { border-color: var(--ink); }
.btn.primary { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.btn.primary:hover { opacity: .9; }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.btn.wide { width: 100%; }
.vh { position: absolute; width: 1px; height: 1px; opacity: 0; overflow: hidden; clip: rect(0 0 0 0); }
input.vh:focus-visible + label { outline: 3px solid var(--accent); outline-offset: 2px; }
.ai-badge { display: inline-flex; align-items: center; font-family: var(--f-num); font-size: .72rem; font-weight: 600; letter-spacing: .08em; padding: 2px 8px; border-radius: 6px; background: var(--violet); color: #fff; }
.ai-badge.sm { font-size: .62rem; padding: 1px 5px; }
.cta { display: flex; flex-wrap: wrap; gap: 10px; }
.btn-hero { font: inherit; font-size: 1rem; font-weight: 500; display: inline-flex; align-items: center; gap: 10px; padding: 12px 20px; border-radius: 999px; border: 1px solid var(--iron-muted); background: transparent; color: var(--iron-ink); cursor: pointer; text-decoration: none; }
.btn-hero:hover { background: var(--iron-2); }
.btn-hero.primary { background: var(--iron-ink); color: var(--iron); border-color: var(--iron-ink); }
.btn-hero.primary:hover { background: var(--iron-ink); opacity: .9; }
.ai-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--violet); box-shadow: 0 0 0 4px color-mix(in srgb, var(--violet) 30%, transparent); }


/* Google: calendar, sheets, search */
.gcal { background: var(--surface); border-radius: 14px; box-shadow: var(--shadow); padding: 18px 20px; display: grid; gap: 14px; }
.gcal-h { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 14px; align-items: end; }
.gcal-h .caption { margin-top: 4px; }
input[type="time"] { font: inherit; font-size: 1rem; padding: 8px 10px; border-radius: 10px; border: 1px solid var(--line); background: var(--bg); color: var(--ink); }
.gcal-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.gcal-list li { display: grid; grid-template-columns: minmax(0, 1fr) auto auto; gap: 10px; align-items: center; padding: 10px 12px; border-radius: 10px; background: var(--bg); }
.gcal-list b { display: block; font-weight: 500; }
.gcal-list small { color: var(--muted); font-size: .8rem; }
.gcal-list select { font: inherit; font-size: .9rem; padding: 7px 10px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); }
@media (max-width: 520px) { .gcal-list li { grid-template-columns: 1fr 1fr; } .gcal-list li > div { grid-column: 1 / -1; } }
.btn.sm { padding: 7px 12px; font-size: .86rem; }
#log-export { margin-top: -6px; }
.gsearch { display: inline-flex; gap: 6px; align-items: center; margin-top: 8px; font-size: .78rem; color: var(--muted); text-decoration: none; }
.gsearch:hover { color: var(--accent); }

/* training schedule */
.rec { background: var(--iron); color: var(--iron-ink); border-radius: 16px; padding: 20px; display: grid; gap: 14px; }
.rec h3 { font-size: 1.35rem; }
.rec .why { font-size: .86rem; color: var(--iron-muted); }
.rec-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 1px; background: var(--iron-2); border-radius: 12px; overflow: hidden; }
.rec-grid div { background: var(--iron); padding: 12px 14px; display: grid; gap: 2px; }
.rec-grid b { font-family: var(--f-num); font-size: 1.3rem; font-variant-numeric: tabular-nums; }
.rec-grid span { font-size: .8rem; color: var(--iron-muted); }
.rec ul { margin: 0; padding-inline-start: 18px; color: var(--iron-muted); font-size: .9rem; display: grid; gap: 4px; }
.rec .btn-hero { justify-self: start; }
.rec .ok { color: #5fd08f; font-size: .9rem; }
.sched-bar { display: flex; flex-wrap: wrap; gap: 12px 20px; align-items: end; background: var(--surface); border-radius: 14px; box-shadow: var(--shadow); padding: 14px 18px; }
.sched-bar .caption { flex: 1 1 260px; }
.sched-bar select, .wday select { font: inherit; font-size: .9rem; padding: 7px 10px; border-radius: 8px; border: 1px solid var(--line); background: var(--bg); color: var(--ink); }
.swarn { display: grid; gap: 8px; }
.wn { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; padding: 10px 14px; border-radius: 10px; font-size: .9rem; background: color-mix(in srgb, var(--yellow) 14%, var(--surface)); border-inline-start: 4px solid var(--yellow); }
.wn.ok { background: color-mix(in srgb, var(--green) 12%, var(--surface)); border-color: var(--green); }
.wn.info { background: var(--accent-soft); border-color: var(--accent); }
.week { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 8px; }
@media (max-width: 980px) { .week { grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); } }
.wday { background: var(--surface); border-radius: 12px; box-shadow: var(--shadow); padding: 12px; display: grid; gap: 8px; align-content: start; border-top: 4px solid var(--c); min-width: 0; }
.wday.today { outline: 2px solid var(--violet); outline-offset: 2px; }
.wd-h { display: flex; justify-content: space-between; align-items: baseline; gap: 6px; }
.wd-h b { font-weight: 700; }
.wd-h small { color: var(--muted); font-family: var(--f-num); font-size: .78rem; }
.wday select, .wday input[type="time"] { width: 100%; font-size: .9rem; padding: 6px 8px; }
.wd-w { font-size: .84rem; color: var(--muted); line-height: 1.4; }
.wd-tag { font-size: .7rem; color: var(--violet); font-weight: 700; letter-spacing: .04em; }
.wday .btn.sm { padding: 6px 8px; font-size: .78rem; }
.restbox { background: var(--surface); border-radius: 14px; box-shadow: var(--shadow); padding: 18px 20px; display: grid; gap: 8px; }
.restbox ul { margin: 0; padding-inline-start: 20px; color: var(--muted); display: grid; gap: 4px; }
.nextbar { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 14px; padding-block: 10px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); background: color-mix(in srgb, var(--violet) 14%, var(--bg)); border-bottom: 1px solid var(--line); font-size: .92rem; }
.nextbar .nb-k { font-size: .76rem; font-weight: 700; color: var(--violet); letter-spacing: .04em; }
.nextbar .nb-in { color: var(--muted); font-variant-numeric: tabular-nums; }
.nextbar .linkbtn { margin-inline-start: auto; }
.toast { position: fixed; z-index: 50; top: calc(12px + env(safe-area-inset-top, 0px)); left: 50%; transform: translateX(-50%); width: max-content; max-width: calc(100vw - 32px); background: var(--ink); color: var(--bg); padding: 12px 16px; border-radius: 12px; box-shadow: 0 12px 30px -10px rgba(0,0,0,.5); display: flex; gap: 12px; align-items: center; font-weight: 500; }
.toast button { border: 0; background: transparent; color: inherit; font-size: 1.1rem; cursor: pointer; padding: 0 4px; }

/* weight check */
.pair3 { display: grid; grid-template-columns: repeat(auto-fit, minmax(110px, 1fr)); gap: 12px; }
.verdict { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 12px; align-items: start; padding: 14px; border-radius: 12px; background: var(--iron-2); border-inline-start: 4px solid var(--vc); }
.verdict .vdot { width: 14px; height: 14px; border-radius: 50%; background: var(--vc); margin-top: 6px; box-shadow: 0 0 0 4px color-mix(in srgb, var(--vc) 25%, transparent); }
.verdict b { display: block; font-family: var(--f-display); font-weight: 400; font-size: 1.45rem; line-height: 1.2; color: var(--vc); }
.verdict span { color: var(--iron-muted); font-size: .9rem; }
.gauge { position: relative; padding-top: 14px; }
.gbar { display: flex; height: 12px; border-radius: 6px; overflow: hidden; gap: 2px; }
.gmark { position: absolute; top: 0; width: 0; height: 0; border-inline: 7px solid transparent; border-top: 10px solid var(--iron-ink); transform: translateX(-50%); }
[dir="rtl"] .gmark { transform: translateX(50%); }
.gticks { position: relative; height: 18px; font-family: var(--f-num); font-size: .72rem; color: var(--iron-muted); margin-top: 4px; }
.gticks span { position: absolute; top: 0; transform: translateX(-50%); }
[dir="rtl"] .gticks span { transform: translateX(50%); }
.glabels { display: flex; justify-content: space-between; gap: 6px; font-size: .72rem; color: var(--iron-muted); }

/* plate scanner */
.scan { display: grid; gap: 18px; margin-top: 14px; scroll-margin-top: 70px; }
.scan-head { display: grid; gap: 6px; justify-items: start; }
.scan-head h3 { font-size: clamp(1.5rem, 3.6vw, 1.9rem); }
.scan-head p { color: var(--muted); }
.scan-grid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.15fr); gap: 16px; align-items: start; }
@media (max-width: 760px) { .scan-grid { grid-template-columns: 1fr; } }
.scan-in { background: var(--surface); border-radius: 16px; box-shadow: var(--shadow); padding: 18px; display: grid; gap: 12px; min-width: 0; }
.drop { position: relative; aspect-ratio: 4 / 3; max-width: 100%; border-radius: 12px; border: 2px dashed var(--line); background: var(--bg); overflow: hidden; display: grid; place-items: center; cursor: pointer; }
.drop.over { border-color: var(--accent); background: var(--accent-soft); }
.drop img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; display: none; }
.drop.has { border-style: solid; cursor: default; }
.drop.has img { display: block; }
.drop-empty { display: grid; justify-items: center; gap: 8px; color: var(--muted); text-align: center; padding: 16px; font-size: .92rem; }
.drop.has .drop-empty { display: none; }
.drop-x { position: absolute; top: 8px; inset-inline-end: 8px; width: 34px; height: 34px; border-radius: 50%; border: 0; background: rgba(0,0,0,.6); color: #fff; font-size: 1.1rem; cursor: pointer; display: none; }
.drop.has .drop-x { display: block; }
.sc-btns { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.sc-lbl { font-size: .9rem; font-weight: 500; }
.sc-lbl small { color: var(--muted); font-weight: 400; }
.scan-in textarea, .coach-f textarea { font: inherit; font-size: .95rem; color: var(--ink); background: var(--bg); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; width: 100%; resize: vertical; }
textarea:focus { border-color: var(--accent); outline: none; box-shadow: 0 0 0 3px var(--accent-soft); }
.sc-warn { font-size: .86rem; color: var(--muted); background: var(--bg); border-radius: 8px; padding: 8px 10px; }
.scan-out { background: var(--surface); border-radius: 16px; box-shadow: var(--shadow); padding: 18px; min-height: 240px; display: grid; align-content: start; gap: 14px; min-width: 0; }
.sc-empty { color: var(--muted); display: grid; gap: 10px; }
.sc-loading { display: flex; align-items: center; gap: 12px; color: var(--muted); }
.spinner { width: 20px; height: 20px; border-radius: 50%; border: 3px solid var(--line); border-top-color: var(--violet); animation: spin .8s linear infinite; flex: none; display: inline-block; }
@keyframes spin { to { transform: rotate(360deg); } }
.skel { height: 14px; border-radius: 7px; background: linear-gradient(90deg, var(--bg), var(--line), var(--bg)); background-size: 200% 100%; animation: shimmer 1.2s infinite; }
@keyframes shimmer { to { background-position: -200% 0; } }
@media (prefers-reduced-motion: reduce) { .spinner, .skel { animation: none; } }
.sc-err { color: var(--red); font-size: .9rem; }
.sc-top { display: flex; justify-content: space-between; gap: 12px; align-items: start; }
.sc-top h4 { font-family: var(--f-display); font-weight: 400; font-size: 1.35rem; margin: 0 0 6px; line-height: 1.2; }
.pill { display: inline-block; font-size: .76rem; padding: 2px 9px; border-radius: 999px; background: var(--bg); color: var(--muted); }
.pill.high { color: var(--green); background: color-mix(in srgb, var(--green) 14%, transparent); }
.pill.medium { color: var(--yellow); background: color-mix(in srgb, var(--yellow) 16%, transparent); }
.pill.low { color: var(--red); background: color-mix(in srgb, var(--red) 14%, transparent); }
.score { display: grid; justify-items: center; min-width: 78px; padding: 8px 10px; border-radius: 12px; background: var(--bg); text-align: center; }
.score b { font-family: var(--f-num); font-size: 1.6rem; line-height: 1; }
.score small { color: var(--muted); }
.score span { font-size: .7rem; color: var(--muted); line-height: 1.2; }
.sc-tot { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; }
@media (max-width: 480px) { .sc-tot { grid-template-columns: repeat(3, 1fr); } }
.tile { background: var(--bg); border-radius: 10px; padding: 10px; display: grid; border-top: 3px solid var(--c, var(--ink)); min-width: 0; }
.tile b { font-family: var(--f-num); font-size: 1.2rem; font-variant-numeric: tabular-nums; }
.tile b small { font-size: .7rem; color: var(--muted); font-weight: 500; }
.tile span { font-size: .76rem; color: var(--muted); }
.tbl { overflow-x: auto; }
.sc-items { width: 100%; border-collapse: collapse; font-size: .9rem; }
.sc-items th { text-align: start; font-size: .76rem; color: var(--muted); font-weight: 500; padding: 6px; border-bottom: 1px solid var(--line); }
.sc-items td { padding: 6px; border-bottom: 1px dashed var(--line); font-variant-numeric: tabular-nums; }
.sc-items td.n { font-family: var(--f-num); white-space: nowrap; }
.sc-items input { width: 76px; font: inherit; font-family: var(--f-num); padding: 4px 6px; border-radius: 6px; border: 1px solid var(--line); background: var(--bg); color: var(--ink); }
.sc-tip { background: color-mix(in srgb, var(--violet) 10%, var(--surface)); border-radius: 12px; padding: 12px 14px; display: grid; gap: 4px; }
.sc-tip b { font-size: .82rem; color: var(--violet); }
.sc-note, .sc-disc { font-size: .85rem; color: var(--muted); }
.sc-act { display: flex; flex-wrap: wrap; gap: 8px; }

/* daily dashboard + logging (scan page) */
#scansec { gap: 16px; }
.dash { background: var(--surface); border-radius: 22px; box-shadow: var(--shadow); padding: 20px; display: grid; gap: 16px; }
.dash-top { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
.dash-top h3 { font-size: 1.35rem; }
.dash-top small { color: var(--muted); font-size: .85rem; display: block; margin-top: 2px; }
.streak { font-size: .85rem; font-weight: 600; padding: 5px 12px; border-radius: 999px; background: color-mix(in srgb, var(--red) 12%, transparent); color: var(--red); white-space: nowrap; }
.dash-main { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 22px; align-items: center; }
@media (max-width: 540px) { .dash-main { grid-template-columns: 1fr; justify-items: center; } }
.bigring { position: relative; width: 176px; height: 176px; }
.bigring svg { width: 100%; height: 100%; transform: rotate(-90deg); }
.bigring .trk { fill: none; stroke: var(--bg); stroke-width: 11; }
.bigring .val { fill: none; stroke: var(--violet); stroke-width: 11; stroke-linecap: round; transition: stroke-dasharray .6s; }
.bigring.over .val { stroke: var(--red); }
.bigring .c { position: absolute; inset: 0; display: grid; place-content: center; text-align: center; line-height: 1.1; }
.bigring .c b { font-family: var(--f-num); font-size: 2.1rem; font-variant-numeric: tabular-nums; }
.bigring .c span { font-size: .85rem; font-weight: 600; }
.bigring .c small { color: var(--muted); font-size: .76rem; margin-top: 4px; }
.mac { display: grid; gap: 12px; width: 100%; }
.mac-row { display: grid; gap: 5px; }
.mac-row .top { display: flex; justify-content: space-between; gap: 8px; font-size: .9rem; }
.mac-row .top span { display: inline-flex; align-items: center; gap: 7px; font-weight: 500; }
.mac-row .top b { font-family: var(--f-num); font-weight: 600; font-variant-numeric: tabular-nums; }
.mac-row .top b small { color: var(--muted); font-weight: 500; }
.mbar { height: 10px; border-radius: 5px; background: var(--bg); overflow: hidden; }

  function setPlanDays(n) {
    var el = bForm.querySelector('input[name="b-days"][value="' + n + '"]');
    if (el) { el.checked = true; swaps = {}; renderPlan(); }
  }
  $("schedsec").addEventListener("click", function (e) {
    var sync = e.target.closest("[data-sync]");
    if (sync) { setPlanDays(+sync.getAttribute("data-sync")); return; }
    if (!e.target.closest("#rec-apply")) return;
    var r = recommend();
    var time = (sched.week.filter(function (d) { return d.type === "train"; })[0] || {}).time || "18:00";
    var ns = defaultSched(r.days, time, sched.remind);
    var order = weekOrder(), rests = order.filter(function (wd) { return ns.week[wd].type === "rest"; });
    if (rests.length >= 3) ns.week[rests[0]].type = "active";
    if (r.goal === "cut" && rests.length >= 2) { ns.week[rests[rests.length - 1]].type = "cardio"; ns.week[rests[rests.length - 1]].time = time; }
    sched = ns;
    recMsg = t("recApplied");
    saveSched();
    setPlanDays(r.days);
    renderSched();
  });

  function csvCell(v) { v = String(v == null ? "" : v); return /[",\n]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v; }
  function toCsv(rows) { return "\ufeff" + rows.map(function (r) { return r.map(csvCell).join(","); }).join("\r\n"); }
  function toTsv(rows) { return rows.map(function (r) { return r.map(function (v) { return String(v == null ? "" : v).replace(/[\t\n]/g, " "); }).join("\t"); }).join("\n"); }
  function planRows() {
    var rows = [[t("cvDay"), t("cvEx"), t("cvSets"), t("cvVideo")]];
    planDays().forEach(function (d, i) { d.items.forEach(function (it) { rows.push([t("day") + " " + (i + 1) + " ¬∑ " + d.title, it.name, it.sets, it.video]); }); });
    return rows;
  }
  function logRows() {
    var head = [[t("cvDate"), t("cvTime"), t("cvMeal"), t("kcal"), t("protein") + " (" + t("g") + ")", t("carbs") + " (" + t("g") + ")", t("fat") + " (" + t("g") + ")"]];
    function rowsOf(day, meals) {
      return meals.slice().sort(function (a, b) { return num(a.at) - num(b.at); }).map(function (m) {
        var d = new Date(num(m.at));
        return [day, pad(d.getHours()) + ":" + pad(d.getMinutes()), m.dish, Math.round(num(m.kcal)), Math.round(num(m.protein)), Math.round(num(m.carbs)), Math.round(num(m.fat))];
      });
    }
    if (!userCol) return Promise.resolve(head.concat(rowsOf(todayKey(), todayMeals)));
    return userCol.get().then(function (snap) {
      var days = snap.docs.filter(function (d) { return d.id.indexOf("day-") === 0; }).map(function (d) { var x = d.data() || {}; return { day: x.day || d.id.slice(4), meals: Array.isArray(x.meals) ? x.meals : [] }; })
        .sort(function (a, b) { return a.day < b.day ? -1 : 1; });
      var out = head.slice();
      days.forEach(function (d) { out = out.concat(rowsOf(d.day, d.meals)); });
      return out;
    }, function () { return head.concat(rowsOf(todayKey(), todayMeals)); });
  }
  function saveCsv(rows, filename, msgEl) {
    if (rows.length < 2) { msgEl.textContent = t("expEmpty"); return; }
    use("downloads").then(function (dl) {
      if (!dl) { try { var a = document.createElement("a"); a.href = URL.createObjectURL(new Blob(["\ufeff" + toCsv(rows)], { type: "text/csv" })); a.download = filename; document.body.appendChild(a); a.click(); a.remove(); msgEl.textContent = t("expSaved"); } catch (e) { msgEl.textContent = t("expNo"); } return; }
      return dl.save({ filename: filename, data: toCsv(rows) }).then(function () { msgEl.textContent = t("expSaved"); }, function (e) {
        msgEl.textContent = e && e.code === "declined" ? t("expDeclined") : (e && (e.code === "unavailable" || e.code === "not_granted")) ? t("expNo") : t("expFail");
      });
    });
  }
  function copyRows(rows, msgEl) {
    if (rows.length < 2) { msgEl.textContent = t("expEmpty"); return; }
    try {
      navigator.clipboard.writeText(toTsv(rows)).then(function () { msgEl.textContent = t("expCopied"); }, function () { msgEl.textContent = t("expFail"); });
    } catch (e) { msgEl.textContent = t("expFail"); }
  }
  $("plan-csv").addEventListener("click", function () { saveCsv(planRows(), "training-plan.csv", $("plan-exp-msg")); });
  $("plan-copy").addEventListener("click", function () { copyRows(planRows(), $("plan-exp-msg")); });
  $("log-csv").addEventListener("click", function () { logRows().then(function (rows) { saveCsv(rows, "food-log.csv", $("log-exp-msg")); }); });
  $("log-copy").addEventListener("click", function () {
    if (!userCol) { copyRows(logRowsSync(), $("log-exp-msg")); return; }
    logRows().then(function (rows) { copyRows(rows, $("log-exp-msg")); });
  });
  function logRowsSync() {
    var rows = [[t("cvDate"), t("cvTime"), t("cvMeal"), t("kcal"), t("protein") + " (" + t("g") + ")", t("carbs") + " (" + t("g") + ")", t("fat") + " (" + t("g") + ")"]];
    todayMeals.forEach(function (m) { var d = new Date(num(m.at)); rows.push([todayKey(), pad(d.getHours()) + ":" + pad(d.getMinutes()), m.dish, Math.round(num(m.kcal)), Math.round(num(m.protein)), Math.round(num(m.carbs)), Math.round(num(m.fat))]); });
    return rows;
  }

  /* ---------- pages ---------- */
  var VIEWS = ["home", "food", "weight", "scan", "plan", "sched", "library", "coach", "tips"];
  var curView = "home";
  function go(v, quiet) {
    if (VIEWS.indexOf(v) === -1) v = "home";
    curView = v;
    document.querySelectorAll(".view").forEach(function (el) { el.hidden = el.getAttribute("data-view") !== v; });
    document.querySelectorAll(".nv[data-go], .nv2").forEach(function (b) {
      if (b.getAttribute("data-go") === v) b.setAttribute("aria-current", "page"); else b.removeAttribute("aria-current");
    });
    if (["food", "weight", "sched", "library", "tips"].indexOf(v) !== -1) $("nv-more").setAttribute("aria-current", "page"); else $("nv-more").removeAttribute("aria-current");
    closeMore();
    try { localStorage.setItem("view", v); } catch (e) {}
    try { if (location.hash.slice(1) !== v) history.replaceState(null, "", "#" + v); } catch (e) {}
    if (!quiet) window.scrollTo(0, 0);
    if (v === "coach") {
      renderCoach();
      if (!quiet) setTimeout(function () { var ci = $("coach-in"); if (!ci.disabled) ci.focus(); }, 30);
    }
  }
  document.addEventListener("click", function (e) {
    var b = e.target.closest("[data-go]");
    if (!b) return;
    e.preventDefault();
    go(b.getAttribute("data-go"));
  });
  function closeMore() { $("msheet").hidden = true; $("nv-more").setAttribute("aria-expanded", "false"); }
  $("nv-more").addEventListener("click", function () {
    var s = $("msheet");
    s.hidden = !s.hidden;
    $("nv-more").setAttribute("aria-expanded", s.hidden ? "false" : "true");
  });
  $("msheet").addEventListener("click", function (e) { if (e.target === $("msheet")) closeMore(); });
  document.addEventListener("keydown", function (e) { if (e.key === "Escape" && !$("msheet").hidden) closeMore(); });
  function openQr() { closeMore(); $("qrmodal").hidden = false; setTimeout(function () { $("qrx").focus(); }, 30); }
  function closeQr() { $("qrmodal").hidden = true; }
  document.addEventListener("click", function (e) { if (e.target.closest("[data-qr]")) openQr(); });
  document.addEventListener("keydown", function (e) {
    var q = e.target.closest && e.target.closest("[data-qr]");
    if (q && (e.key === "Enter" || e.key === " ")) { e.preventDefault(); openQr(); }
    if (e.key === "Escape" && !$("qrmodal").hidden) closeQr();
  });
  $("qrx").addEventListener("click", closeQr);
  $("qrmodal").addEventListener("click", function (e) { if (e.target === $("qrmodal")) closeQr(); });
  $("qrcopy").addEventListener("click", function () {
    var b = $("qrcopy");
    function done(k) { b.textContent = t(k); setTimeout(function () { b.textContent = t("qrCopy"); }, 2000); }
    try { navigator.clipboard.writeText("https://roy-code2013.github.io/pocket-coach/muscle/").then(function () { done("lCopied"); }, function () { done("expFail"); }); } catch (e) { done("expFail"); }
  });
  window.addEventListener("hashchange", function () {
    var v = location.hash.slice(1);
    if (VIEWS.indexOf(v) !== -1 && v !== curView) go(v);
  });

  /* capabilities */
  use("sample").then(function (s) {
    sampleFn = s;
    aiState = s ? "on" : "off";
    if (!s) return;
    return s.limits().then(function (l) { canImages = !!(l && l.images); }, function () { canImages = false; });
  }).then(function () { renderScanUi(); renderCoach(); });

  Promise.all([use("db"), use("user")]).then(function (caps) {
    var db = caps[0], user = caps[1];
    return (user ? Promise.resolve(user.id()).catch(function () { return null; }) : Promise.resolve(null)).then(function (uid) {
      dbChecked = true;
      if (!db || !uid) { renderToday(); return; }
      try { dayRef = db.collection("data/users/" + uid).doc("day-" + todayKey()); } catch (e) { dayRef = null; renderToday(); return; }
      userCol = db.collection("data/users/" + uid);
      subscribeChats();
      computeStreak();
      prodRef = userCol.doc("products");
      prodRef.get().then(function (snap) {
        var d = snap.exists ? snap.data() : null;
        if (d && d.items && typeof d.items === "object") {
          Object.keys(d.items).forEach(function (k) { if (!products[k]) products[k] = d.items[k]; });
          try { localStorage.setItem("products", JSON.stringify(products)); } catch (e) {}
        }
      }, function () { prodRef = null; });
      schedRef = userCol.doc("schedule");
      schedRef.onSnapshot(function (snap) {
        if (schedSaving || !snap.exists) return;
        var s = cleanSched(snap.data());
        if (!s) return;
        sched = s;
        try { localStorage.setItem("sched", JSON.stringify(sched)); } catch (e) {}
        if (gcReady) renderSched();
      }, function () { schedRef = null; });
      var slow = setTimeout(function () { logNote = t("logSlow"); renderToday(); }, 10000);
      dayRef.onSnapshot(function (snap) {
        if (!snap.metadata.fromCache) { clearTimeout(slow); if (logNote === t("logSlow")) logNote = ""; }
        if (!saving) {
          var d = snap.exists ? snap.data() : null;
          todayMeals = d && Array.isArray(d.meals) ? d.meals.slice() : [];
          todayWater = d ? Math.min(20, Math.round(num(d.water))) : 0;
        }
        renderToday();
      }, function () {
        clearTimeout(slow);
        dayRef = null;
        logNote = t("logOff");
        renderToday();
      });
    });
  });

  applyLang();
  renderLib();
  renderPlan();
  calc();
  renderScanUi();
  renderScan();
  renderCoach();
  renderWeight();
  gcReady = true;
  renderSched();
  var startView = location.hash.slice(1);
  if (VIEWS.indexOf(startView) === -1) { try { startView = localStorage.getItem("view"); } catch (e) { startView = null; } }
  go(startView || "home", true);
})();
</script>
</body>
</html>
