<body>
<title>בונים שריר</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Secular+One&family=IBM+Plex+Sans+Hebrew:wght@400;500;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Layout: פס פתיחה כהה כמו רצפת חדר כושר, ניווט דביק, ופרקים שכל אחד מסומן בצבע של פלטת משקל תחרותית */
:root {
  --bg: #f2f3f6;          /* אבקת מגנזיום */
  --surface: #ffffff;
  --ink: #171a21;         /* ברזל יצוק */
  --muted: #5b6272;
  --line: #dadde5;
  --accent: #1f4fd1;      /* פלטת 20 ק"ג */
  --accent-soft: #e3eafc;
  --red: #c8261f;         /* 25 */
  --yellow: #d9a400;      /* 15 */
  --green: #1d8a4a;       /* 10 */
  --violet: #6a3fc8;
  --iron: #14171d;        /* פס הפתיחה, כהה בשני המצבים */
  --iron-2: #1e222b;
  --iron-ink: #f1f2f5;
  --iron-muted: #9aa1b0;
  --shadow: 0 1px 2px rgba(20,23,29,.05), 0 8px 24px -12px rgba(20,23,29,.18);
  --f-display: "Secular One", "Arial Hebrew", sans-serif;
  --f-body: "IBM Plex Sans Hebrew", "Arial Hebrew", system-ui, sans-serif;
  --f-num: "IBM Plex Mono", ui-monospace, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #101318; --surface: #191d25; --ink: #eceef2; --muted: #a3a9b6; --line: #2b313c;
    --accent: #7097ff; --accent-soft: #1c2948; --red: #f05b52; --yellow: #f0c23a; --green: #4cc27e; --violet: #a98bff;
    --iron: #0a0c10; --iron-2: #151920;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px -12px rgba(0,0,0,.6);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #101318; --surface: #191d25; --ink: #eceef2; --muted: #a3a9b6; --line: #2b313c;
  --accent: #7097ff; --accent-soft: #1c2948; --red: #f05b52; --yellow: #f0c23a; --green: #4cc27e; --violet: #a98bff;
  --iron: #0a0c10; --iron-2: #151920;
  --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px -12px rgba(0,0,0,.6);
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 17px; line-height: 1.7; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
.wrap { max-width: 920px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
h1, h2, h3 { font-family: var(--f-display); font-weight: 400; line-height: 1.1; text-wrap: balance; margin: 0; }
h2 { font-size: clamp(1.8rem, 4.6vw, 2.5rem); }
h3 { font-size: 1.22rem; }
p { margin: 0; max-width: 64ch; }
a { color: var(--accent); }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; border-radius: 4px; }

/* ---------- hero ---------- */
.hero { background: var(--iron); color: var(--iron-ink); position: relative; overflow: hidden; }
.hero::after { /* רצפת גומי: רשת עדינה */
  content: ""; position: absolute; inset: 0; pointer-events: none; opacity: .5;
  background-image: linear-gradient(var(--iron-2) 1px, transparent 1px), linear-gradient(90deg, var(--iron-2) 1px, transparent 1px);
  background-size: 48px 48px;
  mask-image: linear-gradient(to bottom, transparent, #000 40%, #000 70%, transparent);
  -webkit-mask-image: linear-gradient(to bottom, transparent, #000 40%, #000 70%, transparent);
}
.hero .wrap { position: relative; z-index: 1; padding-block: 28px 40px; display: grid; gap: 22px; }
.topbar { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
.eyebrow { font-size: .82rem; letter-spacing: .12em; color: var(--iron-muted); font-weight: 500; display: flex; align-items: center; gap: 10px; }
.eyebrow::before { content: ""; width: 28px; height: 3px; background: var(--red); border-radius: 2px; }
.langs { display: inline-flex; gap: 2px; padding: 3px; border: 1px solid var(--iron-2); border-radius: 999px; background: rgba(255,255,255,.03); }
.langs button { font: inherit; font-size: .85rem; cursor: pointer; border: 0; background: transparent; color: var(--iron-muted); padding: 6px 14px; border-radius: 999px; white-space: nowrap; }
.langs button:hover { color: var(--iron-ink); }
.langs button[aria-pressed="true"] { background: var(--iron-ink); color: var(--iron); }
.hero h1 { font-size: clamp(3rem, 11vw, 6.2rem); letter-spacing: -.01em; margin-top: 18px; }
.hero h1 em { font-style: normal; color: transparent; -webkit-text-stroke: 2px var(--iron-ink); }
.lede { font-size: clamp(1.05rem, 2.4vw, 1.25rem); color: var(--iron-muted); max-width: 52ch; }
.lede b { color: var(--iron-ink); font-weight: 500; }
.bar { width: 100%; max-width: 100%; height: auto; display: block; margin-block: 6px; overflow: visible; }
.bar .p { transform-box: fill-box; transform-origin: center; }
@media (prefers-reduced-motion: no-preference) {
  .bar .l { animation: slideL .7s cubic-bezier(.2,.8,.2,1) both; }
  .bar .r { animation: slideR .7s cubic-bezier(.2,.8,.2,1) both; }
  .bar .d1 { animation-delay: .05s } .bar .d2 { animation-delay: .15s } .bar .d3 { animation-delay: .25s } .bar .d4 { animation-delay: .35s }
  @keyframes slideL { from { transform: translateX(-60px); } to { transform: none; } }
  @keyframes slideR { from { transform: translateX(60px); } to { transform: none; } }
}
.stats { display: grid; grid-template-columns: repeat(4, 1fr); border-top: 1px solid var(--iron-2); padding-top: 22px; gap: 16px; }
.stat { display: grid; gap: 2px; }
.stat .v { font-family: var(--f-num); font-weight: 600; font-size: clamp(1.2rem, 3.4vw, 1.75rem); font-variant-numeric: tabular-nums; }
.stat .k { font-size: .85rem; color: var(--iron-muted); line-height: 1.35; }
.stat:nth-child(1) .v { color: var(--red); } .stat:nth-child(2) .v { color: #8aa8ff; } .stat:nth-child(3) .v { color: #f3c94a; } .stat:nth-child(4) .v { color: #5fd08f; }
@media (max-width: 600px) { .stats { grid-template-columns: repeat(2, 1fr); row-gap: 20px; } }

.dot { width: 9px; height: 9px; border-radius: 50%; flex: none; }


/* ---------- app shell: side menu, one page at a time ---------- */
.app { display: grid; grid-template-columns: 250px minmax(0, 1fr); min-height: 100vh; }
.side { position: sticky; top: env(safe-area-inset-top, 0px); align-self: start; height: calc(100vh - env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; gap: 18px; padding-block: 22px; padding-inline: 14px; background: var(--iron); color: var(--iron-ink); overflow-y: auto; }
.brand { display: flex; align-items: center; gap: 10px; font-family: var(--f-display); font-size: 1.35rem; line-height: 1; padding: 4px 8px; }
.logo { width: 34px; height: 22px; flex: none; }
.snav { display: grid; gap: 4px; }
.nv { font: inherit; font-size: .98rem; display: flex; align-items: center; gap: 12px; width: 100%; padding: 11px 12px; border-radius: 10px; border: 0; background: transparent; color: var(--iron-muted); cursor: pointer; text-align: start; }
.nv:hover { background: var(--iron-2); color: var(--iron-ink); }
.nv[aria-current="page"] { background: var(--iron-ink); color: var(--iron); }
.nv svg { width: 20px; height: 20px; flex: none; }
.nv .ai-badge.sm { margin-inline-start: auto; }
.side .langs { margin-top: auto; justify-content: center; flex-wrap: wrap; }
.main { min-width: 0; display: flex; flex-direction: column; min-height: 100vh; }
.main footer { margin-top: auto; }
.view { animation: viewin .25s ease both; }
@keyframes viewin { from { opacity: .4; transform: translateY(6px); } to { opacity: 1; transform: none; } }
@media (prefers-reduced-motion: reduce) { .view { animation: none; } }
.mtop { display: none; }
@media (max-width: 820px) {
  .app { grid-template-columns: 1fr; }
  body::before { background: var(--iron); }
  .side { position: fixed; z-index: 40; inset: auto 0 0 0; top: auto; height: auto; flex-direction: row; gap: 0; overflow: visible; border-top: 1px solid var(--iron-2); padding-block: 6px calc(6px + env(safe-area-inset-bottom, 0px)); padding-left: max(6px, env(safe-area-inset-left, 0px)); padding-right: max(6px, env(safe-area-inset-right, 0px)); }
  .side .brand, .side .langs, .side .qrbox { display: none; }
  .snav { grid-auto-flow: column; grid-auto-columns: minmax(56px, 1fr); width: 100%; gap: 2px; overflow-x: auto; scrollbar-width: none; }
  .nv { flex-direction: column; justify-content: center; gap: 3px; padding: 7px 2px; font-size: .64rem; text-align: center; line-height: 1.2; }
  .nv span { max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .nv .ai-badge.sm { display: none; }
  .mtop { display: flex; position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; justify-content: space-between; align-items: center; gap: 10px; padding-block: 10px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); background: var(--iron); color: var(--iron-ink); border-bottom: 1px solid var(--iron-2); }
  .mtop .brand { font-size: 1.1rem; padding: 0; }
  .mtop .langs button { padding: 5px 10px; font-size: .78rem; }
  .main { padding-bottom: calc(66px + env(safe-area-inset-bottom, 0px)); }
  main section { padding-block: 36px; }
  .coach { height: calc(100vh - 250px); }
}


/* QR to open the site on a phone */
.qrbox { display: grid; grid-template-columns: 64px minmax(0, 1fr); gap: 10px; align-items: center; padding: 10px; border-radius: 12px; background: var(--iron-2); margin-top: auto; }
.qrimg { width: 64px; height: 64px; background: #fff; border-radius: 8px; padding: 3px; }
.qr { width: 100%; height: 100%; display: block; }
.qrbox b { display: block; font-size: .85rem; font-weight: 600; }
.qrbox small { display: block; font-size: .74rem; color: var(--iron-muted); line-height: 1.35; }
.side .langs { margin-top: 0; display: grid; grid-template-columns: 1fr 1fr; border-radius: 12px; }
.side .langs button { font-size: .78rem; padding: 7px 6px; border-radius: 9px; white-space: normal; line-height: 1.25; }
.qrbox { cursor: pointer; transition: background .15s; }
.qrbox:hover { background: color-mix(in srgb, var(--iron-ink) 10%, var(--iron-2)); }
.side .qrbox { grid-template-columns: 44px minmax(0, 1fr); padding: 8px 10px; gap: 10px; }
.side .qrimg { width: 44px; height: 44px; padding: 2px; border-radius: 6px; }
[hidden] { display: none !important; }
/* ---------- games: camera rep counter ---------- */
.fcmodal.ok .fc-stage, .gmodal.ok .g-stage { box-shadow: inset 0 0 0 6px #22c55e, inset 0 0 90px 30px rgba(34,197,94,.55); }
.fcmodal.bad .fc-stage, .gmodal.bad .g-stage { box-shadow: inset 0 0 0 6px #ef4444, inset 0 0 90px 30px rgba(239,68,68,.55); }
.fcmodal.wait .fc-stage, .gmodal.wait .g-stage { box-shadow: inset 0 0 0 6px #eab308, inset 0 0 70px 20px rgba(234,179,8,.35); }
.gmodal.flash .g-stage { animation: gflash .35s ease-out; }
@keyframes gflash { from { box-shadow: inset 0 0 0 14px #fff, inset 0 0 160px 60px rgba(34,197,94,.9); } }
.gmodal { position: fixed; z-index: 62; inset: 0; background: #000; color: #fff; font-family: var(--f-body); }
.g-stage { position: absolute; inset: 0; display: grid; transition: box-shadow .2s; }
.g-stage video, .g-stage canvas { grid-area: 1 / 1; width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1); min-height: 0; }
.g-top { position: absolute; top: 0; inset-inline: 0; display: flex; align-items: center; gap: 12px; padding: 16px 16px 40px; background: linear-gradient(rgba(0,0,0,.8), transparent); }
.g-top b { flex: 1; font-size: 1.05rem; min-width: 0; }
.g-time { font-family: var(--f-num); font-size: 1.6rem; font-weight: 600; min-width: 3ch; text-align: center; }
.g-top .qrx { position: static; flex: none; }
.g-count { position: absolute; inset-inline: 0; bottom: calc(96px + env(safe-area-inset-bottom, 0px)); text-align: center; font-family: var(--f-display); font-size: clamp(5rem, 22vw, 9rem); line-height: 1; text-shadow: 0 6px 30px rgba(0,0,0,.6); pointer-events: none; }
.g-count.pop { animation: gpop .3s ease-out; }
@keyframes gpop { from { transform: scale(1.35); color: #4ade80; } }
.g-big { position: absolute; inset: 0; display: grid; place-items: center; font-family: var(--f-display); font-size: clamp(6rem, 30vw, 12rem); text-shadow: 0 6px 30px rgba(0,0,0,.7); pointer-events: none; }
.g-msg { position: absolute; bottom: 0; inset-inline: 0; margin: 0; padding: 40px 16px calc(22px + env(safe-area-inset-bottom, 0px)); text-align: center; font-size: 1.05rem; font-weight: 600; background: linear-gradient(transparent, rgba(0,0,0,.85)); }
.g-end { position: absolute; inset: 0; display: grid; place-items: center; padding: 16px; background: rgba(0,0,0,.6); }
.g-card { width: min(380px, 100%); background: var(--surface); color: var(--ink); border-radius: 22px; padding: 26px 22px; display: grid; gap: 12px; justify-items: center; text-align: center; }
.g-card .g-score { font-family: var(--f-display); font-size: 4.2rem; line-height: 1; }
.g-card .g-rec { color: var(--green); font-weight: 700; }
.g-card .g-btns { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
.rank { display: inline-flex; align-items: center; gap: 7px; padding: 5px 12px 5px 8px; border-radius: 999px; font-weight: 700; font-size: .85rem; background: color-mix(in srgb, var(--rc) 18%, transparent); color: var(--ink); border: 1px solid color-mix(in srgb, var(--rc) 55%, transparent); }
.rank::before { content: ""; width: 14px; height: 14px; border-radius: 4px; transform: rotate(45deg); background: var(--rc); box-shadow: 0 0 10px var(--rc); }
.g-level { display: grid; gap: 8px; background: var(--iron); color: var(--iron-ink); border-radius: 18px; padding: 18px 20px; margin-top: 18px; }
.g-level-row { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.g-level-row b { font-family: var(--f-display); font-size: 1.6rem; }
.g-level-row span { color: var(--iron-muted); font-size: .9rem; }
.g-bar { height: 10px; border-radius: 99px; background: var(--iron-2); overflow: hidden; }
.g-bar i { display: block; height: 100%; background: linear-gradient(90deg, var(--green), var(--yellow)); border-radius: 99px; }
.g-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 14px; margin-top: 16px; }
.g-game { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 18px; display: grid; gap: 10px; align-content: start; }
.g-game h3 { font-size: 1.25rem; }
.g-game p { color: var(--muted); font-size: .92rem; line-height: 1.5; margin: 0; }
.g-stats { display: flex; gap: 16px; flex-wrap: wrap; font-size: .88rem; color: var(--muted); }
.g-stats b { font-family: var(--f-num); color: var(--ink); font-size: 1.05rem; }
.g-game .g-btns { display: flex; gap: 8px; flex-wrap: wrap; }
.g-ladder { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 4px; }
.g-ladder .rank { font-size: .74rem; opacity: .45; }
.g-ladder .rank.on { opacity: 1; }
.g-opts { display: grid; gap: 12px; margin-top: 14px; background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 16px 18px; }
.g-opt { display: grid; gap: 8px; }
.g-opt b { font-size: .92rem; }
.g-chips { display: flex; gap: 8px; flex-wrap: wrap; }
.g-wins { font-size: .9rem; color: var(--muted); }
.g-bot { font-family: var(--f-num); font-weight: 600; font-size: 1.05rem; padding: 6px 12px; border-radius: 999px; background: rgba(255,255,255,.16); white-space: nowrap; }
.g-bot.ahead { background: #ef4444; }
.g-vs { display: grid; gap: 4px; padding: 10px 14px; border-radius: 14px; width: 100%; }
.g-vs b { font-size: 1.3rem; }
.g-vs.gWin { background: color-mix(in srgb, var(--green) 18%, transparent); }
.g-vs.gLose { background: color-mix(in srgb, var(--red) 15%, transparent); }
.g-vs.gTie { background: color-mix(in srgb, var(--yellow) 18%, transparent); }
/* ---------- form check: live pose skeleton ---------- */
.fcmodal { position: fixed; z-index: 62; inset: 0; background: #000; color: #fff; }
.fc-stage { position: absolute; inset: 0; display: grid; transition: box-shadow .2s; }
.fc-stage video, .fc-stage canvas { grid-area: 1 / 1; width: 100%; height: 100%; object-fit: contain; transform: scaleX(-1); min-height: 0; }
.fc-top { position: absolute; top: 0; inset-inline: 0; display: flex; align-items: center; gap: 14px; padding: 16px 16px 28px; background: linear-gradient(rgba(0,0,0,.8), transparent); }
.fc-light { width: 48px; height: 48px; border-radius: 50%; flex: none; background: #eab308; box-shadow: 0 0 18px 4px rgba(234,179,8,.55); transition: background .2s, box-shadow .2s; }
.fc-light.ok { background: #22c55e; box-shadow: 0 0 26px 8px rgba(34,197,94,.75); }
.fc-light.bad { background: #ef4444; box-shadow: 0 0 26px 8px rgba(239,68,68,.75); }
.fc-txt { display: grid; gap: 3px; flex: 1; min-width: 0; }
.fc-txt b { font-size: 1.05rem; }
.fc-txt span { font-size: 1rem; line-height: 1.4; }
.fc-top .qrx { position: static; flex: none; }
.fc-hint { position: absolute; bottom: 0; inset-inline: 0; margin: 0; padding: 28px 16px calc(16px + env(safe-area-inset-bottom, 0px)); font-size: .88rem; text-align: center; background: linear-gradient(transparent, rgba(0,0,0,.8)); }
.fcopen { display: inline-flex; align-items: center; gap: 6px; font-weight: 600; }
.cammodal { position: fixed; z-index: 61; inset: 0; background: #000; display: grid; grid-template-rows: 1fr auto; }
.cammodal video { width: 100%; height: 100%; object-fit: contain; background: #000; min-height: 0; }
.cam-bar { display: flex; align-items: center; justify-content: center; gap: 28px; padding: 18px 16px calc(18px + env(safe-area-inset-bottom, 0px)); }
.cam-shot { width: 74px; height: 74px; border-radius: 50%; border: 5px solid #fff; background: rgba(255,255,255,.25); cursor: pointer; }
.cam-shot:active { background: #fff; }
.cam-bar .btn { background: rgba(255,255,255,.14); color: #fff; border-color: transparent; }
.qrmodal { position: fixed; z-index: 60; inset: 0; background: rgba(10,12,16,.72); display: grid; place-items: center; padding: 16px; }
.qrmodal-in { position: relative; width: min(420px, 100%); background: var(--surface); color: var(--ink); border-radius: 22px; padding: 24px; display: grid; gap: 12px; justify-items: center; text-align: center; box-shadow: 0 30px 80px -20px rgba(0,0,0,.6); }
.qrmodal-in h3 { font-size: 1.5rem; }
.qrbig { width: min(320px, 78vw); aspect-ratio: 1; background: #fff; border-radius: 16px; padding: 10px; }
.qrlink { font-family: var(--f-num); font-size: .82rem; color: var(--muted); word-break: break-all; }
.qrx { position: absolute; top: 10px; inset-inline-end: 10px; width: 38px; height: 38px; border-radius: 50%; border: 0; background: var(--bg); color: var(--ink); font-size: 1.2rem; cursor: pointer; }
.msheet .qrbox { display: none; }
.msheet .qrimg { width: 44px; height: 44px; padding: 2px; }
.msheet .qrbox small { color: var(--muted); }

/* ---------- phone: drawer + touch sizes ---------- */
.nv-more { display: none; }
.msheet { position: fixed; z-index: 39; inset: 0; background: rgba(0,0,0,.45); display: flex; align-items: flex-end; }
.msheet-in { width: 100%; background: var(--surface); color: var(--ink); border-radius: 22px 22px 0 0; padding-top: 10px; padding-bottom: calc(86px + env(safe-area-inset-bottom, 0px)); padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: grid; gap: 14px; animation: sheetup .22s ease both; }
@keyframes sheetup { from { transform: translateY(40px); opacity: .4; } to { transform: none; opacity: 1; } }
@media (prefers-reduced-motion: reduce) { .msheet-in { animation: none; } }
.msheet-grab { width: 40px; height: 4px; border-radius: 2px; background: var(--line); justify-self: center; }
.msheet-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.nv2 { font: inherit; font-size: .82rem; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; padding: 14px 6px; border-radius: 14px; border: 0; background: var(--bg); color: var(--ink); cursor: pointer; text-align: center; line-height: 1.25; }
.nv2 svg { width: 24px; height: 24px; }
.nv2[aria-current="page"] { background: var(--ink); color: var(--bg); }
.msheet .langs { justify-self: center; border-color: var(--line); background: var(--bg); }
.msheet .langs button { color: var(--muted); }
.msheet .langs button[aria-pressed="true"] { background: var(--ink); color: var(--bg); }
@media (max-width: 820px) {
  .nv.nv-x { display: none; }
  .nv-more { display: flex; }
  .snav { grid-auto-columns: minmax(0, 1fr); overflow: visible; }
  .nv { font-size: .7rem; padding: 8px 2px; gap: 4px; }
  .nv svg { width: 22px; height: 22px; }
  .nv[aria-current="page"] { background: transparent; color: var(--iron-ink); }
  .nv[aria-current="page"] svg { background: var(--violet); color: #fff; border-radius: 10px; padding: 4px; width: 32px; height: 26px; }
  input, select, textarea { font-size: 16px !important; }
  .hero .wrap { padding-block: 22px 30px; gap: 18px; }
  .hero h1 { margin-top: 6px; }
  .cta .btn-hero { flex: 1 1 auto; justify-content: center; }
  main section { padding-block: 28px; gap: 18px; }
  .sec-head { gap: 6px; }
  .intro { font-size: .98rem; }
  .frow { flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none; padding-bottom: 2px; }
  .frow::-webkit-scrollbar { display: none; }
  .frow .chip, .frow .lbl { flex: none; }
  .glass { width: 30px; height: 36px; }
  .swap, .step button, .mrow .mdel, .meals button, .icon-btn { width: 40px; height: 40px; }
  .pv { width: 40px; height: 36px; }
  .day li.pl { gap: 8px; }
  .bigring { width: 158px; height: 158px; }
  .bigring .c b { font-size: 1.9rem; }
  .dash, .logcard { border-radius: 18px; padding: 16px; }
  .chips4 { gap: 6px; }
  .chip2 b { font-size: 1rem; }
  .sheet-act { grid-template-columns: 1fr; }
  .rec-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .week { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .calc .in, .out-inner { padding: 18px; }
  .kcal .v { font-size: 2.6rem; }
  #coachsec { padding-block: 12px; }
  #coachsec .sec-head { display: none; }
  .coach { height: calc(100vh - 170px); height: calc(100dvh - 170px); min-height: 360px; border-radius: 16px; }
  .msg { max-width: 92%; }
  .toast { top: calc(66px + env(safe-area-inset-top, 0px)); }
  .nextbar { font-size: .85rem; }
  .mtop .langs button { padding: 5px 12px; }
}
@media (max-width: 380px) {
  .chips4 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .week { grid-template-columns: 1fr; }
  .msheet-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
}

/* ---------- sections ---------- */
main section { padding-block: 64px; display: grid; gap: 22px; }
main section + section { border-top: 1px solid var(--line); }
.sec-head { display: grid; gap: 10px; }
.chap { display: inline-flex; align-items: center; gap: 10px; font-family: var(--f-num); font-size: .8rem; letter-spacing: .1em; color: var(--muted); }
.chap i { width: 8px; height: 26px; border-radius: 2px; background: var(--c); display: inline-block; }
.intro { color: var(--muted); font-size: 1.05rem; }

.pillars { display: grid; grid-template-columns: repeat(2, 1fr); gap: 16px; }
@media (max-width: 640px) { .pillars { grid-template-columns: 1fr; } }
.pillar { background: var(--surface); border-radius: 14px; padding: 22px; display: grid; grid-template-columns: auto 1fr; gap: 6px 18px; align-items: start; box-shadow: var(--shadow); min-width: 0; }
.pillar .disc { grid-row: span 3; width: 56px; height: 56px; border-radius: 50%; background: var(--c); position: relative; }
.pillar .disc::after { content: ""; position: absolute; inset: 21px; border-radius: 50%; background: var(--surface); }
.pillar .big { font-family: var(--f-num); font-weight: 600; font-size: 1.45rem; color: var(--ink); line-height: 1.2; }
.pillar p { color: var(--muted); font-size: .97rem; }

/* RIR */
.rir { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; align-items: end; background: var(--surface); padding: 22px 18px 16px; border-radius: 14px; box-shadow: var(--shadow); }
.rir .col { display: grid; gap: 8px; justify-items: center; text-align: center; }
.rir .fill { width: 100%; max-width: 70px; border-radius: 8px 8px 3px 3px; background: var(--accent); height: var(--h); }
.rir .off .fill { background: var(--line); }
.rir .n { font-family: var(--f-num); font-weight: 600; font-size: 1.35rem; line-height: 1; }
.rir small { color: var(--muted); font-size: .8rem; line-height: 1.3; }
.rir .band { grid-column: 1 / 5; border-top: 2px solid var(--accent); padding-top: 6px; font-size: .82rem; color: var(--accent); text-align: center; font-weight: 500; }
.caption { font-size: .9rem; color: var(--muted); }

/* calculator */
.calc { display: grid; grid-template-columns: 1.1fr 1fr; border-radius: 16px; box-shadow: var(--shadow); }
.calc .in { background: var(--surface); padding: 24px; display: grid; gap: 22px; align-content: start; border-start-start-radius: 16px; border-end-start-radius: 16px; min-width: 0; }
.calc .out { background: var(--iron); color: var(--iron-ink); border-start-end-radius: 16px; border-end-end-radius: 16px; min-width: 0; }
@media (max-width: 760px) {
  .calc { grid-template-columns: 1fr; }
  .calc .in { border-radius: 16px 16px 0 0; }
  .calc .out { border-radius: 0 0 16px 16px; }
}
.out-inner { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 16px); padding: 24px; display: grid; gap: 18px; }
fieldset { border: 0; margin: 0; padding: 0; min-width: 0; }
.field { display: grid; gap: 8px; }
.field-top { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
.field-top label, legend { font-size: .9rem; color: var(--ink); font-weight: 500; padding: 0; }
legend { margin-bottom: 8px; }
.field-top small, legend small { color: var(--muted); font-weight: 400; }
output { font-family: var(--f-num); font-weight: 600; font-variant-numeric: tabular-nums; color: var(--accent); unicode-bidi: isolate; }
.pair { display: grid; grid-template-columns: 1fr 1fr; gap: 22px; }
@media (max-width: 420px) { .pair { grid-template-columns: 1fr; } }
input[type="range"] { width: 100%; accent-color: var(--accent); margin: 0; height: 28px; cursor: pointer; }
input[type="number"] { font: inherit; font-size: 1rem; color: var(--ink); background: var(--bg); border: 1px solid var(--line); border-radius: 10px; padding: 9px 12px; width: 100%; }
input[type="number"]:focus { border-color: var(--accent); outline: none; box-shadow: 0 0 0 3px var(--accent-soft); }
.seg { display: grid; grid-template-columns: repeat(var(--n, 2), 1fr); gap: 6px; }
.seg.col { grid-template-columns: 1fr; }
.opt { position: relative; cursor: pointer; }
.opt input { position: absolute; opacity: 0; inset: 0; margin: 0; cursor: pointer; }
.opt span { display: flex; justify-content: center; align-items: baseline; gap: 10px; padding: 9px 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--bg); font-size: .93rem; text-align: center; transition: background .15s, border-color .15s; }
.seg.col .opt span { justify-content: space-between; text-align: start; }
.opt span small { color: var(--muted); font-size: .8rem; }
.opt:hover span { border-color: var(--muted); }
.opt input:checked + span { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.opt input:checked + span small { color: inherit; opacity: .75; }
.opt input:focus-visible + span { outline: 3px solid var(--accent); outline-offset: 2px; }
.kcal { display: grid; gap: 2px; }
.kcal .v { font-family: var(--f-num); font-weight: 600; font-size: clamp(2.6rem, 7vw, 3.6rem); line-height: 1; font-variant-numeric: tabular-nums; }
.kcal .l { color: var(--iron-muted); font-size: .9rem; }
.kcal .d { color: var(--iron-muted); font-size: .85rem; font-family: var(--f-num); }
.split { display: flex; height: 12px; border-radius: 6px; overflow: hidden; gap: 3px; }
.split span { transition: flex-grow .4s; min-width: 4px; }
.macros { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
.macro { display: grid; gap: 0; }
.macro .v { font-family: var(--f-num); font-weight: 600; font-size: 1.4rem; font-variant-numeric: tabular-nums; }
.macro .v small { font-size: .8rem; color: var(--iron-muted); font-weight: 500; }
.macro .l { font-size: .82rem; color: var(--iron-muted); display: flex; align-items: center; gap: 6px; }
.facts { display: grid; grid-template-columns: 1fr 1fr; gap: 1px; background: var(--iron-2); border-radius: 12px; overflow: hidden; margin: 0; }
.facts div { background: var(--iron); padding: 12px 14px; display: grid; gap: 2px; }
.facts dt { font-size: .8rem; color: var(--iron-muted); }
.facts dd { margin: 0; font-family: var(--f-num); font-weight: 600; font-size: 1.1rem; font-variant-numeric: tabular-nums; }
.copy { font: inherit; font-size: .92rem; cursor: pointer; border: 1px solid var(--iron-muted); background: transparent; color: var(--iron-ink); border-radius: 10px; padding: 9px 14px; justify-self: start; }
.copy:hover { background: var(--iron-2); }
.calc .note { font-size: .85rem; color: var(--iron-muted); border-top: 1px solid var(--iron-2); padding-top: 12px; }
.out details { background: transparent; box-shadow: none; border: 1px solid var(--iron-2); }
.out summary { padding: 10px 14px; font-size: .9rem; color: var(--iron-ink); }
.out details p { padding: 0 14px 12px; color: var(--iron-muted); font-size: .85rem; }

/* program */
.tabs { display: inline-flex; gap: 4px; padding: 4px; background: var(--surface); border-radius: 12px; box-shadow: var(--shadow); justify-self: start; flex-wrap: wrap; }
.tab { font: inherit; font-size: .95rem; cursor: pointer; border: 0; background: transparent; color: var(--muted); padding: 8px 16px; border-radius: 9px; }
.tab[aria-selected="true"] { background: var(--ink); color: var(--bg); }
.days { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 16px; }
.day { background: var(--surface); border-radius: 14px; box-shadow: var(--shadow); overflow: hidden; min-width: 0; }
.day header { display: flex; justify-content: space-between; align-items: baseline; padding: 14px 18px; border-bottom: 1px solid var(--line); }
.day header small { font-family: var(--f-num); color: var(--muted); font-size: .8rem; }
.day ul { list-style: none; margin: 0; padding: 6px 18px 12px; display: grid; }
.day li { display: flex; justify-content: space-between; gap: 12px; padding-block: 8px; font-size: .96rem; }
.day li + li { border-top: 1px dashed var(--line); }
.day .sets { font-family: var(--f-num); color: var(--accent); white-space: nowrap; direction: ltr; font-weight: 500; }

/* buttons + AI bits */
.btn { font: inherit; font-size: .95rem; font-weight: 500; display: inline-flex; align-items: center; justify-content: center; gap: 8px; padding: 10px 16px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); cursor: pointer; text-decoration: none; }
.btn:hover { border-color: var(--ink); }
.btn.primary { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.btn.primary:hover { opacity: .9; }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.btn.wide { width: 100%; }
.vh { position: absolute; width: 1px; height: 1px; opacity: 0; overflow: hidden; clip: rect(0 0 0 0); }
input.vh:focus-visible + label { outline: 3px solid var(--accent); outline-offset: 2px; }
.ai-badge { display: inline-flex; align-items: center; font-family: var(--f-num); font-size: .72rem; font-weight: 600; letter-spacing: .08em; padding: 2px 8px; border-radius: 6px; background: var(--violet); color: #fff; }
.ai-badge.sm { font-size: .62rem; padding: 1px 5px; }
.cta { display: flex; flex-wrap: wrap; gap: 10px; }
.btn-hero { font: inherit; font-size: 1rem; font-weight: 500; display: inline-flex; align-items: center; gap: 10px; padding: 12px 20px; border-radius: 999px; border: 1px solid var(--iron-muted); background: transparent; color: var(--iron-ink); cursor: pointer; text-decoration: none; }
.btn-hero:hover { background: var(--iron-2); }
.btn-hero.primary { background: var(--iron-ink); color: var(--iron); border-color: var(--iron-ink); }
.btn-hero.primary:hover { background: var(--iron-ink); opacity: .9; }
.ai-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--violet); box-shadow: 0 0 0 4px color-mix(in srgb, var(--violet) 30%, transparent); }


/* Google: calendar, sheets, search */
.gcal { background: var(--surface); border-radius: 14px; box-shadow: var(--shadow); padding: 18px 20px; display: grid; gap: 14px; }
.gcal-h { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 14px; align-items: end; }
.gcal-h .caption { margin-top: 4px; }
input[type="time"] { font: inherit; font-size: 1rem; padding: 8px 10px; border-radius: 10px; border: 1px solid var(--line); background: var(--bg); color: var(--ink); }
.gcal-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.gcal-list li { display: grid; grid-template-columns: minmax(0, 1fr) auto auto; gap: 10px; align-items: center; padding: 10px 12px; border-radius: 10px; background: var(--bg); }
.gcal-list b { display: block; font-weight: 500; }
.gcal-list small { color: var(--muted); font-size: .8rem; }
.gcal-list select { font: inherit; font-size: .9rem; padding: 7px 10px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); }
@media (max-width: 520px) { .gcal-list li { grid-template-columns: 1fr 1fr; } .gcal-list li > div { grid-column: 1 / -1; } }
.btn.sm { padding: 7px 12px; font-size: .86rem; }
#log-export { margin-top: -6px; }
.gsearch { display: inline-flex; gap: 6px; align-items: center; margin-top: 8px; font-size: .78rem; color: var(--muted); text-decoration: none; }
.gsearch:hover { color: var(--accent); }

/* training schedule */
.rec { background: var(--iron); color: var(--iron-ink); border-radius: 16px; padding: 20px; display: grid; gap: 14px; }
.rec h3 { font-size: 1.35rem; }
.rec .why { font-size: .86rem; color: var(--iron-muted); }
.rec-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 1px; background: var(--iron-2); border-radius: 12px; overflow: hidden; }
.rec-grid div { background: var(--iron); padding: 12px 14px; display: grid; gap: 2px; }
.rec-grid b { font-family: var(--f-num); font-size: 1.3rem; font-variant-numeric: tabular-nums; }
.rec-grid span { font-size: .8rem; color: var(--iron-muted); }
.rec ul { margin: 0; padding-inline-start: 18px; color: var(--iron-muted); font-size: .9rem; display: grid; gap: 4px; }
.rec .btn-hero { justify-self: start; }
.rec .ok { color: #5fd08f; font-size: .9rem; }
.sched-bar { display: flex; flex-wrap: wrap; gap: 12px 20px; align-items: end; background: var(--surface); border-radius: 14px; box-shadow: var(--shadow); padding: 14px 18px; }
.sched-bar .caption { flex: 1 1 260px; }
.sched-bar select, .wday select { font: inherit; font-size: .9rem; padding: 7px 10px; border-radius: 8px; border: 1px solid var(--line); background: var(--bg); color: var(--ink); }
.swarn { display: grid; gap: 8px; }
.wn { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; padding: 10px 14px; border-radius: 10px; font-size: .9rem; background: color-mix(in srgb, var(--yellow) 14%, var(--surface)); border-inline-start: 4px solid var(--yellow); }
.wn.ok { background: color-mix(in srgb, var(--green) 12%, var(--surface)); border-color: var(--green); }
.wn.info { background: var(--accent-soft); border-color: var(--accent); }
.week { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 8px; }
@media (max-width: 980px) { .week { grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); } }
.wday { background: var(--surface); border-radius: 12px; box-shadow: var(--shadow); padding: 12px; display: grid; gap: 8px; align-content: start; border-top: 4px solid var(--c); min-width: 0; }
.wday.today { outline: 2px solid var(--violet); outline-offset: 2px; }
.wd-h { display: flex; justify-content: space-between; align-items: baseline; gap: 6px; }
.wd-h b { font-weight: 700; }
.wd-h small { color: var(--muted); font-family: var(--f-num); font-size: .78rem; }
.wday select, .wday input[type="time"] { width: 100%; font-size: .9rem; padding: 6px 8px; }
.wd-w { font-size: .84rem; color: var(--muted); line-height: 1.4; }
.wd-tag { font-size: .7rem; color: var(--violet); font-weight: 700; letter-spacing: .04em; }
.wday .btn.sm { padding: 6px 8px; font-size: .78rem; }
.restbox { background: var(--surface); border-radius: 14px; box-shadow: var(--shadow); padding: 18px 20px; display: grid; gap: 8px; }
.restbox ul { margin: 0; padding-inline-start: 20px; color: var(--muted); display: grid; gap: 4px; }
.nextbar { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 14px; padding-block: 10px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); background: color-mix(in srgb, var(--violet) 14%, var(--bg)); border-bottom: 1px solid var(--line); font-size: .92rem; }
.nextbar .nb-k { font-size: .76rem; font-weight: 700; color: var(--violet); letter-spacing: .04em; }
.nextbar .nb-in { color: var(--muted); font-variant-numeric: tabular-nums; }
.nextbar .linkbtn { margin-inline-start: auto; }
.toast { position: fixed; z-index: 50; top: calc(12px + env(safe-area-inset-top, 0px)); left: 50%; transform: translateX(-50%); width: max-content; max-width: calc(100vw - 32px); background: var(--ink); color: var(--bg); padding: 12px 16px; border-radius: 12px; box-shadow: 0 12px 30px -10px rgba(0,0,0,.5); display: flex; gap: 12px; align-items: center; font-weight: 500; }
.toast button { border: 0; background: transparent; color: inherit; font-size: 1.1rem; cursor: pointer; padding: 0 4px; }

/* weight check */
.pair3 { display: grid; grid-template-columns: repeat(auto-fit, minmax(110px, 1fr)); gap: 12px; }
.verdict { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 12px; align-items: start; padding: 14px; border-radius: 12px; background: var(--iron-2); border-inline-start: 4px solid var(--vc); }
.verdict .vdot { width: 14px; height: 14px; border-radius: 50%; background: var(--vc); margin-top: 6px; box-shadow: 0 0 0 4px color-mix(in srgb, var(--vc) 25%, transparent); }
.verdict b { display: block; font-family: var(--f-display); font-weight: 400; font-size: 1.45rem; line-height: 1.2; color: var(--vc); }
.verdict span { color: var(--iron-muted); font-size: .9rem; }
.gauge { position: relative; padding-top: 14px; }
.gbar { display: flex; height: 12px; border-radius: 6px; overflow: hidden; gap: 2px; }
.gmark { position: absolute; top: 0; width: 0; height: 0; border-inline: 7px solid transparent; border-top: 10px solid var(--iron-ink); transform: translateX(-50%); }
[dir="rtl"] .gmark { transform: translateX(50%); }
.gticks { position: relative; height: 18px; font-family: var(--f-num); font-size: .72rem; color: var(--iron-muted); margin-top: 4px; }
.gticks span { position: absolute; top: 0; transform: translateX(-50%); }
[dir="rtl"] .gticks span { transform: translateX(50%); }
.glabels { display: flex; justify-content: space-between; gap: 6px; font-size: .72rem; color: var(--iron-muted); }

/* plate scanner */
.scan { display: grid; gap: 18px; margin-top: 14px; scroll-margin-top: 70px; }
.scan-head { display: grid; gap: 6px; justify-items: start; }
.scan-head h3 { font-size: clamp(1.5rem, 3.6vw, 1.9rem); }
.scan-head p { color: var(--muted); }
.scan-grid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.15fr); gap: 16px; align-items: start; }
@media (max-width: 760px) { .scan-grid { grid-template-columns: 1fr; } }
.scan-in { background: var(--surface); border-radius: 16px; box-shadow: var(--shadow); padding: 18px; display: grid; gap: 12px; min-width: 0; }
.drop { position: relative; aspect-ratio: 4 / 3; max-width: 100%; border-radius: 12px; border: 2px dashed var(--line); background: var(--bg); overflow: hidden; display: grid; place-items: center; cursor: pointer; }
.drop.over { border-color: var(--accent); background: var(--accent-soft); }
.drop img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; display: none; }
.drop.has { border-style: solid; cursor: default; }
.drop.has img { display: block; }
.drop-empty { display: grid; justify-items: center; gap: 8px; color: var(--muted); text-align: center; padding: 16px; font-size: .92rem; }
.drop.has .drop-empty { display: none; }
.drop-x { position: absolute; top: 8px; inset-inline-end: 8px; width: 34px; height: 34px; border-radius: 50%; border: 0; background: rgba(0,0,0,.6); color: #fff; font-size: 1.1rem; cursor: pointer; display: none; }
.drop.has .drop-x { display: block; }
.sc-btns { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.sc-lbl { font-size: .9rem; font-weight: 500; }
.sc-lbl small { color: var(--muted); font-weight: 400; }
.scan-in textarea, .coach-f textarea { font: inherit; font-size: .95rem; color: var(--ink); background: var(--bg); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; width: 100%; resize: vertical; }
textarea:focus { border-color: var(--accent); outline: none; box-shadow: 0 0 0 3px var(--accent-soft); }
.sc-warn { font-size: .86rem; color: var(--muted); background: var(--bg); border-radius: 8px; padding: 8px 10px; }
.scan-out { background: var(--surface); border-radius: 16px; box-shadow: var(--shadow); padding: 18px; min-height: 240px; display: grid; align-content: start; gap: 14px; min-width: 0; }
.sc-empty { color: var(--muted); display: grid; gap: 10px; }
.sc-loading { display: flex; align-items: center; gap: 12px; color: var(--muted); }
.spinner { width: 20px; height: 20px; border-radius: 50%; border: 3px solid var(--line); border-top-color: var(--violet); animation: spin .8s linear infinite; flex: none; display: inline-block; }

.score { display: grid; justify-items: center; min-width: 78px; padding: 8px 10px; border-radius: 12px; background: var(--bg); text-align: center; }

@media (max-width: 480px) { .sc-tot { grid-template-columns: repeat(3, 1fr); } }
.tile { background: var(--bg); border-radius: 10px; padding: 10px; display: grid; border-top: 3px solid var(--c, var(--ink)); min-width: 0; }
.tile b { font-family: var(--f-num); font-size: 1.2rem; font-variant-numeric: tabular-nums; }
.tile b small { font-size: .7rem; color: var(--muted); font-weight: 500; }
.tile span { font-size: .76rem; color: var(--muted); }
.tbl { overflow-x: auto; }
.sc-items { width: 100%; border-collapse: collapse; font-size: .9rem; }

/* daily dashboard + logging (scan page) */
#scansec { gap: 16px; }
.dash { background: var(--surface); border-radius: 22px; box-shadow: var(--shadow); padding: 20px; display: grid; gap: 16px; }
.dash-top { display: flex; justify-content: space-between; align-items: center; gap: 10px; }

.dash-top small { color: var(--muted); font-size: .85rem; display: block; margin-top: 2px; }
.streak { font-size: .85rem; font-weight: 600; padding: 5px 12px; border-radius: 999px; background: color-mix(in srgb, var(--red) 12%, transparent); color: var(--red); white-space: nowrap; }
.dash-main { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 22px; align-items: center; }
@media (max-width: 540px) { .dash-main { grid-template-columns: 1fr; justify-items: center; } }
.bigring { position: relative; width: 176px; height: 176px; }

.bigring .trk { fill: none; stroke: var(--bg); stroke-width: 11; }
.bigring .val { fill: none; stroke: var(--violet); stroke-width: 11; stroke-linecap: round; transition: stroke-dasharray .6s; }

.bigring .c span { font-size: .85rem; font-weight: 600; }

.mac { display: grid; gap: 12px; width: 100%; }

.mac-row .top { display: flex; justify-content: space-between; gap: 8px; font-size: .9rem; }

.mbar { height: 10px; border-radius: 5px; background: var(--bg); overflow: hidden; }
.mbar i { display: block; height: 100%; border-radius: 5px; background: var(--c); transition: width .5s; }
.water { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 14px; padding-top: 14px; border-top: 1px solid var(--line); }
.water .wl { font-weight: 500; }
.water .wv { font-family: var(--f-num); font-size: .9rem; color: var(--muted); margin-inline-start: auto; }
.glasses { display: flex; flex-wrap: wrap; gap: 5px; }
.glass { width: 22px; height: 28px; border-radius: 3px 3px 8px 8px; border: 2px solid var(--accent); background: transparent; cursor: pointer; padding: 0; }
.glass.on { background: var(--accent); }
.glass:hover { background: color-mix(in srgb, var(--accent) 30%, transparent); }
.glass.on:hover { background: var(--accent); }
.dash .td-note { color: var(--muted); }
.logcard { background: var(--surface); border-radius: 22px; box-shadow: var(--shadow); padding: 18px; display: grid; gap: 12px; scroll-margin-top: 70px; }
.modes { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; padding: 4px; background: var(--bg); border-radius: 999px; }
.modes button { font: inherit; font-size: .88rem; border: 0; background: transparent; color: var(--muted); padding: 8px 6px; border-radius: 999px; cursor: pointer; }
.modes button[aria-pressed="true"] { background: var(--surface); color: var(--ink); font-weight: 600; box-shadow: 0 1px 4px rgba(0,0,0,.12); }
.logcard .drop { aspect-ratio: 16 / 10; border-radius: 18px; }
.bc-row { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px; }
.bc-row input { font: inherit; font-family: var(--f-num); font-size: 1.05rem; letter-spacing: .06em; padding: 10px 12px; border-radius: 12px; border: 1px solid var(--line); background: var(--bg); color: var(--ink); direction: ltr; text-align: center; min-width: 0; }
.bc-row input:focus { border-color: var(--accent); outline: none; box-shadow: 0 0 0 3px var(--accent-soft); }
.bc-new { font-size: .9rem; padding: 10px 12px; border-radius: 12px; background: color-mix(in srgb, var(--violet) 12%, var(--surface)); border-inline-start: 4px solid var(--violet); }

.btn.big { padding: 14px 18px; font-size: 1rem; border-radius: 14px; }
.sheet { background: var(--surface); border-radius: 22px; box-shadow: var(--shadow); overflow: hidden; display: grid; scroll-margin-top: 70px; }
.sheet:empty { display: none; }
.sheet .pad { padding: 18px; display: grid; gap: 14px; }
.sheet-img { position: relative; aspect-ratio: 16 / 9; max-height: 280px; width: 100%; background: var(--iron); overflow: hidden; }
.sheet-img img { width: 100%; height: 100%; object-fit: cover; display: block; }
.sheet-img .ov { position: absolute; inset: auto 0 0 0; padding: 40px 18px 14px; background: linear-gradient(transparent, rgba(0,0,0,.72)); color: #fff; display: flex; justify-content: space-between; align-items: end; gap: 12px; }
.sheet-hd { padding: 18px 18px 0; display: flex; justify-content: space-between; align-items: start; gap: 12px; }
.sheet h4 { font-family: var(--f-display); font-weight: 400; font-size: 1.45rem; margin: 0 0 6px; line-height: 1.15; }
.sheet-img .pill { background: rgba(255,255,255,.18); color: #fff; }
.sheet-img .score { background: rgba(255,255,255,.16); color: #fff; }
.sheet-img .score small, .sheet-img .score span { color: rgba(255,255,255,.8); }
.kbig { display: flex; align-items: baseline; gap: 8px; }
.kbig b { font-family: var(--f-num); font-size: 2.5rem; line-height: 1; font-variant-numeric: tabular-nums; }
.kbig span { color: var(--muted); }
.chips4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.chip2 { background: var(--bg); border-radius: 14px; padding: 10px 6px; display: grid; gap: 2px; justify-items: center; text-align: center; }
.chip2 i { width: 8px; height: 8px; border-radius: 50%; background: var(--c); }
.chip2 b { font-family: var(--f-num); font-size: 1.1rem; font-variant-numeric: tabular-nums; }
.chip2 span { font-size: .72rem; color: var(--muted); }
.items { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }

.step { grid-row: 1 / span 2; grid-column: 2; display: flex; align-items: center; gap: 4px; }
.step button { width: 30px; height: 30px; border-radius: 50%; border: 1px solid var(--line); background: var(--surface); color: var(--ink); cursor: pointer; font-size: 1.05rem; line-height: 1; padding: 0; }
.step input { width: 62px; text-align: center; font: inherit; font-family: var(--f-num); font-size: .9rem; padding: 5px 4px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); }
.coachtip { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 10px; align-items: start; }

.bubble { background: color-mix(in srgb, var(--violet) 10%, var(--surface)); border-radius: 16px; border-start-start-radius: 4px; padding: 10px 14px; font-size: .92rem; display: grid; gap: 8px; }
.bubble .linkbtn { justify-self: start; font-size: .86rem; color: var(--violet); }
.sheet-act { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 8px; align-items: center; }
.sheet-act select { font: inherit; font-size: .92rem; padding: 12px 10px; border-radius: 14px; border: 1px solid var(--line); background: var(--bg); color: var(--ink); }
.sheet .pad > .linkbtn { justify-self: center; }
.mlist { display: grid; gap: 14px; }
.mgroup { display: grid; gap: 8px; }
.mgroup h4 { display: flex; justify-content: space-between; gap: 8px; margin: 0; font-size: .9rem; color: var(--muted); font-weight: 600; }
.mgroup h4 b { font-family: var(--f-num); font-weight: 600; }
.mrow { display: grid; grid-template-columns: 50px minmax(0, 1fr) auto auto; gap: 12px; align-items: center; background: var(--surface); border-radius: 16px; box-shadow: var(--shadow); padding: 10px 12px; }
.mthumb { width: 50px; height: 50px; border-radius: 12px; object-fit: cover; background: var(--bg); display: grid; place-items: center; color: var(--muted); }
.mrow .mn { font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; display: block; }

.mrow .mk { font-family: var(--f-num); font-weight: 600; text-align: end; white-space: nowrap; }
.mrow .mk small { font-weight: 400; }
.mrow .mdel { border: 0; background: transparent; color: var(--muted); cursor: pointer; font-size: 1.05rem; width: 30px; height: 30px; border-radius: 50%; }
.mrow .mdel:hover { color: var(--red); background: var(--bg); }
.mempty { background: var(--surface); border-radius: 16px; box-shadow: var(--shadow); padding: 18px; color: var(--muted); text-align: center; }

/* today's log */
.today { background: var(--iron); color: var(--iron-ink); border-radius: 16px; padding: 20px; display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 22px; align-items: center; }
@media (max-width: 560px) { .today { grid-template-columns: 1fr; justify-items: center; } }
.ring { position: relative; width: 136px; height: 136px; }
.ring svg { width: 100%; height: 100%; transform: rotate(-90deg); }
.ring .trk { fill: none; stroke: var(--iron-2); stroke-width: 10; }
.ring .val { fill: none; stroke: var(--red); stroke-width: 10; stroke-linecap: round; transition: stroke-dasharray .5s; }
.ring-c { position: absolute; inset: 0; display: grid; place-content: center; text-align: center; line-height: 1.15; }
.ring-c b { font-family: var(--f-num); font-size: 1.7rem; }
.ring-c small, .ring-c span { color: var(--iron-muted); font-size: .76rem; }
.td-main { display: grid; gap: 10px; min-width: 0; width: 100%; }
.td-main h4 { margin: 0; font-family: var(--f-display); font-weight: 400; font-size: 1.35rem; }
.td-left { color: var(--iron-muted); font-size: .92rem; }
.td-bar { display: grid; gap: 4px; font-size: .82rem; color: var(--iron-muted); font-variant-numeric: tabular-nums; }
.td-bar .b { height: 8px; border-radius: 4px; background: var(--iron-2); overflow: hidden; }

.meals { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
.meals li { display: grid; grid-template-columns: auto minmax(0, 1fr) auto auto; gap: 10px; align-items: center; font-size: .9rem; padding: 8px 10px; background: var(--iron-2); border-radius: 8px; }
.meals .tm { font-family: var(--f-num); color: var(--iron-muted); font-size: .8rem; }
.meals .mn { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.meals .mp { font-family: var(--f-num); white-space: nowrap; font-size: .85rem; }
.meals button { border: 0; background: transparent; color: var(--iron-muted); cursor: pointer; font-size: 1rem; width: 28px; height: 28px; border-radius: 50%; }
.meals button:hover { color: var(--iron-ink); background: var(--iron); }
.td-note { font-size: .8rem; color: var(--iron-muted); }

/* AI coach */
.coach { position: relative; background: var(--surface); color: var(--ink); border-radius: 18px; box-shadow: var(--shadow); display: grid; grid-template-rows: auto minmax(0, 1fr) auto auto auto; overflow: hidden; height: min(760px, calc(100vh - 200px)); min-height: 420px; }
#coachsec { padding-block: 32px; }
.coach-h { display: grid; grid-template-columns: auto minmax(0, 1fr) auto auto; gap: 10px; align-items: center; padding: 12px 14px; background: var(--iron); color: var(--iron-ink); }

.coach-h small { color: var(--iron-muted); font-size: .76rem; display: block; line-height: 1.3; }
.coach-av { width: 38px; height: 38px; border-radius: 50%; background: var(--violet); color: #fff; display: grid; place-items: center; font-family: var(--f-num); font-weight: 600; font-size: .8rem; }
.icon-btn { width: 34px; height: 34px; border-radius: 50%; border: 0; background: transparent; color: var(--iron-muted); font-size: 1.15rem; cursor: pointer; }
.icon-btn:hover { background: var(--iron-2); color: var(--iron-ink); }
.coach-msgs { overflow-y: auto; padding: 14px; display: flex; flex-direction: column; gap: 10px; }
.msg { max-width: 88%; padding: 10px 13px; border-radius: 14px; font-size: .94rem; line-height: 1.6; overflow-wrap: anywhere; }
.msg p { margin: 0; max-width: none; }
.msg p + p, .msg ul, .msg p + ul, .msg ul + p { margin-top: 6px; }
.msg ul { margin-bottom: 0; padding-inline-start: 18px; }
.msg.bot { align-self: flex-start; background: var(--bg); border-start-start-radius: 4px; }
.msg.me { align-self: flex-end; background: var(--ink); color: var(--bg); border-start-end-radius: 4px; white-space: pre-wrap; }
.msg.err { color: var(--red); }
.think { color: var(--muted); display: inline-flex; gap: 8px; align-items: center; }
.coach-hist { position: absolute; inset: 0; z-index: 3; background: var(--surface); display: grid; grid-template-rows: auto minmax(0, 1fr); }
.hist-h { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 12px 14px; background: var(--iron); color: var(--iron-ink); }
.hist-h h3 { font-size: 1.05rem; }
.hist-h .btn { padding: 6px 12px; font-size: .85rem; }
.hist-list { list-style: none; margin: 0; padding: 12px; display: grid; gap: 8px; align-content: start; overflow-y: auto; }
.hist-item { display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: center; gap: 4px; border: 1px solid var(--line); border-radius: 12px; background: var(--bg); }
.hist-item.cur { border-color: var(--violet); }
.hist-open { font: inherit; text-align: start; background: none; border: 0; color: var(--ink); padding: 10px 12px; cursor: pointer; display: grid; gap: 2px; min-width: 0; }
.hist-open b { font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.hist-open small { color: var(--muted); font-size: .76rem; font-variant-numeric: tabular-nums; }
.hist-del { font: inherit; font-size: .85rem; border: 0; background: transparent; color: var(--muted); cursor: pointer; padding: 6px 12px; border-radius: 8px; white-space: nowrap; }
.hist-del:hover { color: var(--red); }
.hist-empty { color: var(--muted); font-size: .9rem; padding: 8px 4px; }
.exl { display: inline-flex; flex-wrap: wrap; align-items: center; gap: 4px; margin: 2px 0; vertical-align: middle; }
.exlink { display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px 3px 8px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); text-decoration: none; font-size: .84rem; font-weight: 500; }
.exlink:hover { border-color: var(--red); }
.exlib { font: inherit; font-size: .78rem; border: 0; background: none; color: var(--accent); cursor: pointer; text-decoration: underline; text-underline-offset: 2px; padding: 2px 4px; }
.coach-sug { display: flex; gap: 6px; flex-wrap: wrap; padding: 0 14px 10px; }
.coach-sug button { font: inherit; font-size: .82rem; border: 1px solid var(--line); background: var(--surface); color: var(--ink); padding: 6px 11px; border-radius: 999px; cursor: pointer; text-align: start; }
.coach-sug button:hover { border-color: var(--violet); }
.coach-off { font-size: .85rem; color: var(--muted); padding: 0 14px 10px; }
.coach-f { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px; padding: 10px 12px; border-top: 1px solid var(--line); align-items: end; }

.send { width: 42px; height: 42px; border-radius: 50%; border: 0; background: var(--violet); color: #fff; cursor: pointer; display: grid; place-items: center; }

[dir="rtl"] .send .arrow { transform: scaleX(-1); }

/* personal plan builder */
.builder { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 18px 22px; background: var(--surface); padding: 20px; border-radius: 14px; box-shadow: var(--shadow); }

.b-summary { font-weight: 500; font-size: 1.05rem; }
.day li.pl { display: grid; grid-template-columns: 9px minmax(0, 1fr) auto auto auto; align-items: center; gap: 10px; }
.pn { min-width: 0; }
.pv { display: inline-grid; place-items: center; width: 30px; height: 26px; border-radius: 6px; }
.pv:hover { background: var(--bg); }
.swap { font: inherit; font-size: 1rem; width: 28px; height: 28px; border-radius: 50%; border: 1px solid var(--line); background: transparent; color: var(--muted); cursor: pointer; line-height: 1; padding: 0; }
.swap:hover { color: var(--ink); border-color: var(--ink); }
.vol { background: var(--surface); border-radius: 14px; box-shadow: var(--shadow); padding: 18px 20px; display: grid; gap: 9px; }

.vb { position: relative; height: 12px; background: var(--bg); border-radius: 6px; overflow: hidden; }

  $("qrx").addEventListener("click", closeQr);
  $("qrmodal").addEventListener("click", function (e) { if (e.target === $("qrmodal")) closeQr(); });
  $("qrcopy").addEventListener("click", function () {
    var b = $("qrcopy");
    function done(k) { b.textContent = t(k); setTimeout(function () { b.textContent = t("qrCopy"); }, 2000); }
    try { navigator.clipboard.writeText("https://roy-code2013.github.io/pocket-coach/muscle/").then(function () { done("lCopied"); }, function () { done("expFail"); }); } catch (e) { done("expFail"); }
  });
  window.addEventListener("hashchange", function () {
    var v = location.hash.slice(1);
    if (VIEWS.indexOf(v) !== -1 && v !== curView) go(v);
  });

  /* capabilities */
  use("sample").then(function (s) {
    sampleFn = s;
    aiState = s ? "on" : "off";
    if (!s) return;
    return s.limits().then(function (l) { canImages = !!(l && l.images); }, function () { canImages = false; });
  }).then(function () { renderScanUi(); renderCoach(); });

  Promise.all([use("db"), use("user")]).then(function (caps) {
    var db = caps[0], user = caps[1];
    return (user ? Promise.resolve(user.id()).catch(function () { return null; }) : Promise.resolve(null)).then(function (uid) {
      dbChecked = true;
      if (!db || !uid) { renderToday(); return; }
      try { dayRef = db.collection("data/users/" + uid).doc("day-" + todayKey()); } catch (e) { dayRef = null; renderToday(); return; }
      userCol = db.collection("data/users/" + uid);
      subscribeChats();
      computeStreak();
      prodRef = userCol.doc("products");
      prodRef.get().then(function (snap) {
        var d = snap.exists ? snap.data() : null;
        if (d && d.items && typeof d.items === "object") {
          Object.keys(d.items).forEach(function (k) { if (!products[k]) products[k] = d.items[k]; });
          try { localStorage.setItem("products", JSON.stringify(products)); } catch (e) {}
        }
      }, function () { prodRef = null; });
      schedRef = userCol.doc("schedule");
      schedRef.onSnapshot(function (snap) {
        if (schedSaving || !snap.exists) return;
        var s = cleanSched(snap.data());
        if (!s) return;
        sched = s;
        try { localStorage.setItem("sched", JSON.stringify(sched)); } catch (e) {}
        if (gcReady) renderSched();
      }, function () { schedRef = null; });
      var slow = setTimeout(function () { logNote = t("logSlow"); renderToday(); }, 10000);
      dayRef.onSnapshot(function (snap) {
        if (!snap.metadata.fromCache) { clearTimeout(slow); if (logNote === t("logSlow")) logNote = ""; }
        if (!saving) {
          var d = snap.exists ? snap.data() : null;
          todayMeals = d && Array.isArray(d.meals) ? d.meals.slice() : [];
          todayWater = d ? Math.min(20, Math.round(num(d.water))) : 0;
        }
        renderToday();
      }, function () {
        clearTimeout(slow);
        dayRef = null;
        logNote = t("logOff");
        renderToday();
      });
    });
  });

  applyLang();
  renderLib();
  renderPlan();
  calc();
  renderScanUi();
  renderScan();
  renderCoach();
  renderWeight();
  gcReady = true;
  renderSched();
  var startView = location.hash.slice(1);
  if (VIEWS.indexOf(startView) === -1) { try { startView = localStorage.getItem("view"); } catch (e) { startView = null; } }
  go(startView || "home", true);
})();
</script>
</body>
</html>
